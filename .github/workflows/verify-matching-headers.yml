name: Verify desktop matching gallery headers
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-matching-headers.yml']
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Compare desktop grid and viewer dimensions, typography, counter, and mobile
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          base='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            page=None
            errors=[]
            for attempt in range(1,13):
              current=browser.new_page(viewport={'width':1440,'height':900})
              current.on('pageerror',lambda e:errors.append(str(e)))
              current.goto(base+'?unified-headers-v7-check='+str(attempt)+'-3b5290',wait_until='domcontentloaded',timeout=45000)
              current.wait_for_timeout(1300)
              css=current.locator('link[href*="galeria-escritorio.css"]').get_attribute('href') or ''
              print('ATTEMPT',attempt,'CSS',css,flush=True)
              if 'unified-header-v8' in css:
                page=current
                break
              current.close()
              time.sleep(8)
            assert page, 'New CSS not deployed after testing'
            assert page.locator('.gallery-mosaic').count()==15
            page.locator('.gallery').nth(8).locator('.gallery-tile').first.click()
            grid=page.locator('#vcc-desktop-gallery')
            assert grid.is_visible()
            gridVals=page.evaluate("""() => {
              const panel=document.querySelector('#vcc-desktop-gallery .vcc-dg-panel');
              const header=panel.querySelector('.vcc-dg-top');
              const title=panel.querySelector('.vcc-dg-heading strong');
              const back=panel.querySelector('.vcc-dg-back span');
              const tiles=panel.querySelector('.vcc-dg-tile');
              const r=e=>e.getBoundingClientRect();
              const c=e=>getComputedStyle(e);
              return {
                panel:r(panel).toJSON(),header:r(header).toJSON(),title:r(title).toJSON(),
                imageTop:r(tiles).top, titleFont:c(title).fontFamily,titleWeight:c(title).fontWeight,
                titleSize:c(title).fontSize,backWeight:c(back).fontWeight
              };
            }""")
            print('GRID',gridVals,flush=True)
            grid.locator('.vcc-dg-tile').nth(1).click()
            modal=page.locator('#lightbox.open')
            assert modal.count()==1
            imgVals=page.evaluate("""() => {
              const panel=document.querySelector('#lightbox .lb-stage');
              const header=panel.querySelector('.lb-caption');
              const img=panel.querySelector('.lb-photo');
              const counter=panel.querySelector('.lb-counter');
              const back=panel.querySelector('.vcc-dg-photo-back');
              const left=panel.querySelector('.lb-prev');
              const right=panel.querySelector('.lb-next');
              const r=e=>e.getBoundingClientRect();
              const c=e=>getComputedStyle(e);
              return {
                panel:r(panel).toJSON(), header:r(header).toJSON(),image:r(img).toJSON(),
                titleFont:c(header).fontFamily,titleWeight:c(header).fontWeight,
                titleSize:c(header).fontSize,
                backWeight:c(back).fontWeight,
                countFont:c(counter).fontFamily,countWeight:c(counter).fontWeight,
                countSize:c(counter).fontSize, countText:counter.textContent,
                countY:r(counter).top, counterTransform:c(counter).transform,
                previousFontSize:c(left).fontSize, nextFontSize:c(right).fontSize,
                prevIcon:c(left).backgroundImage,
                nextIcon:c(right).backgroundImage,
                thumbCount:panel.querySelectorAll('.lb-thumbs button').length
              };
            }""")
            print('PHOTO',imgVals,flush=True)
            assert abs(gridVals['panel']['top']-imgVals['panel']['top'])<1.5,(gridVals,imgVals)
            assert abs(gridVals['panel']['height']-imgVals['panel']['height'])<1.5
            assert abs(gridVals['panel']['width']-imgVals['panel']['width'])<1.5
            assert abs(gridVals['header']['bottom']-imgVals['header']['bottom'])<1.5
            assert abs(gridVals['header']['height']-64)<1.5
            assert abs(imgVals['header']['height']-64)<1.5
            assert 'Oswald' in gridVals['titleFont'] and 'Oswald' in imgVals['titleFont']
            assert gridVals['titleWeight']==imgVals['titleWeight']=='500'
            assert gridVals['titleSize']==imgVals['titleSize']=='22px'
            assert gridVals['backWeight']==imgVals['backWeight']=='400'
            assert 'DM Sans' in imgVals['countFont']
            assert imgVals['countWeight']=='400'
            assert imgVals['counterTransform']!='none'
            assert imgVals['countText']=='2 / 9'
            assert imgVals['thumbCount']==9
            assert imgVals['previousFontSize']=='0px' and imgVals['nextFontSize']=='0px'
            assert 'data:image/svg+xml' in imgVals['prevIcon'],imgVals
            assert 'data:image/svg+xml' in imgVals['nextIcon'],imgVals
            assert abs(gridVals['imageTop']-imgVals['image']['top'])<2,(gridVals['imageTop'],imgVals['image']['top'])
            modal.locator('.vcc-dg-photo-back').click()
            assert grid.is_visible()
            grid.locator('.vcc-dg-close').click()
            assert not grid.is_visible()
            assert not errors,errors
            page.close()
            mob=browser.new_page(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
            mob.goto(base+'?mobile-unified-header-v7',wait_until='domcontentloaded',timeout=45000)
            mob.wait_for_timeout(1200)
            mob.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert mob.locator('#vcc-mobile-gallery').is_visible()
            mob.locator('.vcc-mobile-photo-tile').first.click()
            assert mob.locator('.vcc-mobile-photo-view').is_visible()
            mob.close()
            browser.close()
            print('PASS: matching header, titles, panel size, thinner controls, 9 photo count and mobile intact',flush=True)
          PY
