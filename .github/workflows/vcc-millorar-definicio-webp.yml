name: VCC · millorar definició WebP
on:
  push:
    branches: [quality]
    paths:
      - .github/workflows/vcc-millorar-definicio-webp.yml
permissions:
  contents: write
concurrency:
  group: vcc-qualitat-fons-webp
  cancel-in-progress: false
jobs:
  optimitzar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow==11.3.0
      - name: Reprocessar WebP amb definició alta sense tocar les escenes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image,ImageFilter
          from pathlib import Path
          import os,re
          folder=Path("configuracion/imagenes/fondos")
          photos=("fondos-donde-dormir.webp","fondos-que-llevar.webp","fondos-entradas-y-pases.webp",
                  "fondos-cuando-ir.webp","fondos-como-moverse.webp","fondos-como-llegar.webp")
          for name in photos:
              p=folder/name
              assert p.exists(),p
              original=Image.open(p).convert("RGB")
              old_width,old_height=original.size
              if old_width<1500: raise SystemExit("Foto original massa petita: "+str(p))
              goal_width=2560
              target=(goal_width,round(old_height*goal_width/old_width))
              if original.width < goal_width:
                  original=original.resize(target,Image.Resampling.LANCZOS)
                  original=original.filter(ImageFilter.UnsharpMask(radius=1.05,percent=72,threshold=2))
              tmp=p.with_suffix(".vcc-temp.webp")
              original.save(tmp,"WEBP",quality=98,method=6,exact=True)
              check=Image.open(tmp)
              check.load()
              assert check.format=="WEBP" and check.size==target
              assert tmp.stat().st_size>p.stat().st_size
              os.replace(tmp,p)
              print(name,old_width,"x",old_height,"=>",*check.size,p.stat().st_size)
          # Refrescar la memòria cau per a les sis fotos, sense canviar-ne el nom.
          # CSS, HTML i JS, no scripts de manteniment; no alterem l'estil.
          rexp=re.compile(r'(fondos-(?:donde-dormir|que-llevar|entradas-y-pases|cuando-ir|como-moverse|como-llegar)\.webp)(?:\?v=[a-zA-Z0-9._-]+)?')
          changes=0
          for root,dirs,files in os.walk("."):
              dirs[:]=[d for d in dirs if d not in (".git","node_modules",".github","old")]
              for file in files:
                  if not file.endswith((".html",".css",".js")): continue
                  path=Path(root,file)
                  content=path.read_text(encoding="utf-8")
                  new=rexp.sub(r'\1?v=20261111-qualitat-alta-v1',content)
                  if new!=content:
                      path.write_text(new,encoding="utf-8")
                      changes+=1
          print("Referències cache-bust actualitzades:",changes)
          PY
      - name: Verificar integritat d'imatges i referències
        run: |
          set -euo pipefail
          node configuracion/scripts/comprobar-rutas.mjs
          node configuracion/scripts/auditar-recursos.mjs --no-write --enforce-external-baseline
      - name: Desar substitucions de sis WebP a quality
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VCC Assets Maintenance"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/vcc-millorar-definicio-webp.yml
          git add -A configuracion/imagenes/fondos
          git add -u
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Millorar la definició dels 6 fons WebP i refrescar enllaços"
            git push origin HEAD:quality
          fi
