name: Verify unified desktop gallery viewer
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-unified-gallery.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Chrome desktop matching header/sidebar, no counters, single photo pointer, mobile regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          url='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            desk=None; errors=[]
            for attempt in range(1,7):
              page=browser.new_page(viewport={'width':1440,'height':900})
              page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(url+'?unified-v3-probe='+str(attempt)+'-650aa2',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(1700)
              script=page.locator('script[src*="galeria-escritorio.js"]').get_attribute('src') or ''
              css=page.locator('link[href*="galeria-escritorio.css"]').get_attribute('href') or ''
              print('ATTEMPT',attempt,'SCRIPT',script,'CSS',css,flush=True)
              if 'unified-visor-v3' in script and 'unified-visor-v3' in css:
                desk=page
                break
              page.close()
              time.sleep(7)
            assert desk,'Quality did not deploy unified-visor-v3'
            page=desk
            assert page.locator('.imp-page .gallery-mosaic').count()==15
            fifth=page.locator('.imp-page .gallery').nth(4)
            fifth.locator('.gallery-tile').nth(0).click()
            grid=page.locator('#vcc-desktop-gallery')
            assert grid.is_visible()
            assert grid.locator('.vcc-dg-heading strong').inner_text()=='SÖDERMALM'
            assert grid.locator('.vcc-dg-heading span').count()==0, 'grid count remains'
            expectedSubtitle=grid.locator('.vcc-dg-place').inner_text()
            expectedDescription=grid.locator('.vcc-dg-description').inner_text()
            print('GRID',expectedSubtitle,expectedDescription[:80],flush=True)
            grid.locator('.vcc-dg-tile').nth(1).click()
            lightbox=page.locator('#lightbox.open')
            assert lightbox.count()==1
            heading=lightbox.locator('.lb-caption')
            asideTitle=lightbox.locator('.lb-place-info h3')
            asideDescription=lightbox.locator('.lb-place-info p')
            print('PHOTO_HEADING',heading.inner_text(),'PHOTO_ASIDE',asideTitle.inner_text(),flush=True)
            assert heading.inner_text()=='SÖDERMALM'
            assert asideTitle.inner_text()==expectedSubtitle
            assert asideDescription.inner_text()==expectedDescription
            style=page.evaluate("""() => {
              const s=document.querySelector('#lightbox .lb-stage');
              const c=s.querySelector('.lb-caption'),a=s.querySelector('.lb-place-info'),p=s.querySelector('.lb-photo');
              return {
                stageCols:getComputedStyle(s).gridTemplateColumns,
                stageRows:getComputedStyle(s).gridTemplateRows,
                captionDisplay:getComputedStyle(c).display,
                captionHeight:c.getBoundingClientRect().height,
                rightTitleFont:getComputedStyle(a.querySelector('h3')).fontFamily,
                rightTitleColor:getComputedStyle(a.querySelector('h3')).color,
                rightTitleTop:a.querySelector('h3').getBoundingClientRect().top,
                photoTop:p.getBoundingClientRect().top,
                counterDisplay:getComputedStyle(s.querySelector('.lb-counter')).display,
                thumbsDisplay:getComputedStyle(s.querySelector('.lb-thumbs')).display,
                photoWidth:p.getBoundingClientRect().width
              };
            }""")
            print('COMPUTED',style,flush=True)
            assert style['counterDisplay']=='none' and style['thumbsDisplay']=='none'
            assert style['captionDisplay']=='flex'
            assert abs(style['captionHeight']-75)<1.5
            assert 'Caveat' in style['rightTitleFont']
            assert abs(style['rightTitleTop']-style['photoTop'])<45
            assert style['photoWidth']>450
            assert not errors,errors
            lightbox.locator('.vcc-dg-photo-back').click()
            assert grid.is_visible() and page.locator('#lightbox.open').count()==0
            grid.locator('.vcc-dg-close').click()
            # Single-photo gallery: hand cursor on initial tile, grid tile, enlarged photo.
            single=page.locator('.imp-page .gallery').first
            ptr=single.locator('.gallery-tile').first.evaluate('(e)=>getComputedStyle(e).cursor')
            assert ptr=='pointer',ptr
            single.locator('.gallery-tile').first.click()
            assert grid.is_visible() and grid.locator('.vcc-dg-tile').count()==1
            one=grid.locator('.vcc-dg-tile').first
            assert one.evaluate('(e)=>getComputedStyle(e).cursor')=='pointer'
            one.click()
            lightbox=page.locator('#lightbox.open')
            assert lightbox.count()==1 and lightbox.get_attribute('class').find('vcc-dg-single')>=0
            big=lightbox.locator('.lb-photo')
            assert big.evaluate('(e)=>getComputedStyle(e).cursor')=='pointer'
            big.click(position={'x':150,'y':150})
            assert page.locator('#lightbox.open').count()==0
            assert grid.is_visible()
            print('SINGLE_PHOTO_PASS',flush=True)
            page.close()
            mobile=browser.new_page(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
            mobile.goto(url+'?regress-mob-v3',wait_until='domcontentloaded',timeout=45000)
            mobile.wait_for_timeout(2000)
            mobile.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert mobile.locator('#vcc-mobile-gallery').is_visible()
            mobile.locator('.vcc-mobile-photo-tile').first.click()
            assert mobile.locator('.vcc-mobile-photo-view').is_visible()
            mobile.close()
            browser.close()
            print('PASS full desktop viewer matches gallery heading/sidebar, no counts/thumbs, single hand cursor and mobile unchanged',flush=True)
          PY
