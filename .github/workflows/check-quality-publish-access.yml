name: Check Cloudflare publish access for quality
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/check-quality-publish-access.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: quality
    steps:
      - name: Detect deploy credentials without exposing them
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
          CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || vars.CLOUDFLARE_PROJECT_NAME || secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          python - <<'PY'
          import os,urllib.request,json
          token=os.getenv('CF_TOKEN','')
          account=os.getenv('CF_ACCOUNT','')
          proj=os.getenv('CF_PROJECT','')
          print('CLOUDFLARE_TOKEN_PRESENT',bool(token),flush=True)
          print('CLOUDFLARE_ACCOUNT_ID_PRESENT',bool(account),flush=True)
          print('PAGES_PROJECT_CONFIG_PRESENT',bool(proj),flush=True)
          if token and account:
            url='https://api.cloudflare.com/client/v4/accounts/'+account+'/pages/projects?per_page=50'
            req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                data=json.load(resp)
              print('CLOUDFLARE_PROJECT_LIST_OK',data.get('success'))
              for project in data.get('result',[]):
                domains=project.get('domains') or []
                if any('quality.viajandoconcabeza.com' in d for d in domains) or 'quality' in project.get('name','').lower():
                  print('MATCHED_SITE_PROJECT',project.get('name'),'DOMAINS',domains,'SOURCE',project.get('source',{}).get('type'))
            except Exception as exc:
              print('CLOUDFLARE_PROJECT_LIST_ERROR',type(exc).__name__)
          PY