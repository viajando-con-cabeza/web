name: Optimizar hero movil de Cuando ir

on:
  push:
    branches: [quality]
    paths:
      - .github/workflows/optimizar-hero-cuando-ir.yml
      - configuracion/scripts/optimizar-hero-cuando-ir.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-hero-cuando-ir-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    if: github.ref == 'refs/heads/quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate a lighter mobile-only version
        run: |
          python -m pip install --quiet pillow
          python configuracion/scripts/optimizar-hero-cuando-ir.py

      - name: Commit only the new image to Quality
        shell: bash
        run: |
          set -euo pipefail
          FILE="configuracion/imagenes/fondos/fondos-cuando-ir-mobile.webp"
          git add "$FILE"
          if git diff --cached --quiet; then
            echo "Mobile hero already optimized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: add compressed mobile Stockholm Cuándo ir hero"
          git pull --rebase origin quality
          git push origin HEAD:quality
