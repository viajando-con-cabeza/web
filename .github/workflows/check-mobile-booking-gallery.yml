name: Verify Booking-style mobile gallery
on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/check-mobile-booking-gallery.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify both mobile stages and unchanged desktop viewer in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          base='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            mobile=None
            for attempt in range(1,6):
              page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              errors=[]
              failed=[]
              responses=[]
              page.on('pageerror',lambda exc:errors.append(str(exc)))
              page.on('requestfailed',lambda req:failed.append((req.url,req.failure)) if '/optimizadas/' in req.url else None)
              page.on('response',lambda r:responses.append((r.status,r.url)) if '/optimizadas/' in r.url else None)
              resp=page.goto(base+'?booking-test='+str(attempt)+'-71fdeef2',wait_until='domcontentloaded',timeout=45000)
              page.wait_for_timeout(2500)
              loaded=page.locator('script[src*="imprescindibles-galeria-movil.js"]').count()==1 and page.locator('.gallery-mosaic').count()==15
              print('ATTEMPT',attempt,'PAGE_STATUS',resp.status,'LOADED',loaded,'JS_ERRORS',errors,flush=True)
              if loaded:
                mobile=page
                break
              page.close()
              time.sleep(8)
            assert mobile, 'New mobile gallery not deployed'
            page=mobile
            assert not errors,errors
            mosaic=page.locator('.gallery').nth(14)
            assert mosaic.get_attribute('data-count')=='10'
            more=mosaic.locator('.vcc-mobile-more')
            assert more.count()==1 and more.inner_text()=='+5 fotos',more.all_inner_texts()
            sixth=mosaic.locator('.gallery-tile').nth(5)
            assert sixth.evaluate('(e)=>getComputedStyle(e).display')=='none'
            page.locator('.gallery').nth(14).locator('.gallery-tile').first.scroll_into_view_if_needed()
            page.locator('.gallery').nth(14).locator('.gallery-tile').first.click()
            assert page.locator('#vcc-mobile-gallery').is_visible()
            assert page.locator('.vcc-mobile-grid-view').is_visible()
            assert not page.locator('.vcc-mobile-photo-view').is_visible()
            tiles=page.locator('.vcc-mobile-photo-grid .vcc-mobile-photo-tile')
            assert tiles.count()==10,tiles.count()
            rects=[tiles.nth(i).bounding_box() for i in range(4)]
            print('MOBILE_RECTS',rects,flush=True)
            assert rects[0]['width'] > rects[1]['width']*1.8
            assert abs(rects[1]['y']-rects[2]['y'])<6
            assert rects[3]['width'] > rects[1]['width']*1.8
            tiles.nth(1).click()
            assert page.locator('.vcc-mobile-photo-view').is_visible()
            assert not page.locator('.vcc-mobile-grid-view').is_visible()
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 2 de 10'
            large=page.locator('.vcc-mobile-photo-full')
            bg=large.evaluate('(e)=>getComputedStyle(e).backgroundImage')
            print('FULLSCREEN_BG',bg,flush=True)
            assert '/optimizadas/visor/DSC06554.webp' in bg
            width=large.bounding_box()['width']
            print('PHOTO_WIDTH',width,'SCREEN_WIDTH',390,flush=True)
            assert width>=388
            page.keyboard.press('ArrowRight')
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 10'
            page.keyboard.press('Escape')
            assert page.locator('.vcc-mobile-grid-view').is_visible()
            assert not page.locator('.vcc-mobile-photo-view').is_visible()
            page.locator('.vcc-mobile-grid-view [data-vcc-action="exit"]').first.click()
            assert not page.locator('#vcc-mobile-gallery').is_visible()
            assert 'vcc-mobile-gallery-open' not in page.locator('body').get_attribute('class')
            assert not failed,failed
            assert all(code==200 for code,_ in responses),responses
            print('MOBILE_RESPONSES',responses[-12:],flush=True)
            page.close()
            desktop=browser.new_page(viewport={'width':1280,'height':800})
            desktop.goto(base+'?desktop-check=71fdeef2',wait_until='domcontentloaded',timeout=45000)
            desktop.wait_for_timeout(2000)
            assert desktop.locator('.gallery-mosaic').count()==15
            desktop.locator('.gallery-mosaic').first.locator('button').first.click()
            assert desktop.locator('#lightbox.open').count()==1,'Desktop lightbox not opened'
            assert desktop.locator('#vcc-mobile-gallery').is_visible()==False
            desktop.locator('#lightbox .lb-close').click()
            assert desktop.locator('#lightbox.open').count()==0
            desktop.close()
            browser.close()
            print('PASS: responsive Booking-style two-level mobile gallery, WebP, desktop unchanged',flush=True)
          PY
