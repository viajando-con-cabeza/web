name: Verify published quality site cache and HQ image
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-fast-original-webp.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check published HTML version and high-quality WebP
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,time
          base='https://www.quality.viajandoconcabeza.com'
          urls=[
           base+'/destinos/suecia/estocolmo/imprescindibles.html?v=20261106-fast-hq-v9-'+str(int(time.time())),
           base+'/destinos/suecia/goteborg/imagenes/optimizadas/visor-alta/DSC06554.webp?v=20261106-'+str(int(time.time()))
          ]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'VCC-Live-Deploy-Check/1.0'})
              with urllib.request.urlopen(req,timeout=15) as result:
                content=result.read()
                print('LIVE',result.status,'BYTES',len(content),'URL',url,flush=True)
                if '.html' in url:
                  import re
                  m=re.search(rb'imprescindibles-galeria-movil\.js\?v=[^"]+',content)
                  print('LIVE_MOBILE_SCRIPT',m.group(0).decode() if m else 'NOT FOUND',flush=True)
            except urllib.error.HTTPError as e:
              print('LIVE',e.code,'URL',url,flush=True)
          PY
