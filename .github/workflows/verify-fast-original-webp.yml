name: Verify fast VCC mobile gallery locally
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-fast-original-webp.yml']
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality
      - name: Test actual quality-branch files in Chrome
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright Pillow
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/vcc-preview.log 2>&1 &
          echo $! >/tmp/vcc-server.pid
          trap 'kill $(cat /tmp/vcc-server.pid) || true' EXIT
          python - <<'PY'
          import time,re
          from playwright.sync_api import sync_playwright
          url='http://127.0.0.1:8765/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
            failures=[];errors=[]; responses=[]
            page.on('pageerror',lambda e:errors.append(str(e)))
            page.on('requestfailed',lambda r:failures.append((r.url,r.failure)) if 'DSC' in r.url else None)
            page.on('response',lambda r:responses.append((r.status,r.url)) if 'DSC' in r.url else None)
            page.goto(url,wait_until='domcontentloaded',timeout=45000)
            page.wait_for_timeout(1900)
            assert page.locator('.gallery').count()==15, 'gallery sections missing'
            page.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert page.locator('#vcc-mobile-gallery').is_visible()
            page.locator('.vcc-mobile-photo-tile').nth(1).click()
            stage=page.locator('.vcc-mobile-photo-stage')
            large=page.locator('.vcc-mobile-photo-full')
            counter=page.locator('.vcc-photo-count')
            assert counter.inner_text()=='Foto 2 de 6'
            page.wait_for_function("""() => (document.querySelector('.vcc-mobile-photo-full')?.style.backgroundImage||'').includes('/visor-alta/')""",timeout=15000)
            print('HQ_IMAGE',large.evaluate('(e)=>e.style.backgroundImage'),flush=True)
            assert any(code==200 and '/visor-alta/DSC06554.webp' in uri for code,uri in responses),responses[-20:]
            rect=stage.bounding_box();cx=int(rect['x']+rect['width']/2);cy=int(rect['y']+rect['height']/2)
            cdp=page.context.new_cdp_session(page)
            def send(kind,pts):
              cdp.send('Input.dispatchTouchEvent',{'type':kind,'touchPoints':[{'x':round(x),'y':round(y)} for x,y in pts]})
            def swipe(start,end,delay=15):
              send('touchStart',[(start,cy)])
              for i in range(1,5):
                send('touchMove',[(start+(end-start)*i/4,cy)])
                page.wait_for_timeout(delay)
              send('touchEnd',[])
            swipe(cx+120,cx-15)
            page.wait_for_timeout(12)
            swipe(cx+120,cx-10)
            page.wait_for_timeout(330)
            print('TWO_RAPID_SWIPES',counter.inner_text(),flush=True)
            assert counter.inner_text()=='Foto 4 de 6'
            swipe(cx+160,cx-145,10)
            page.wait_for_timeout(390)
            print('DOUBLE_FAST_FLICK',counter.inner_text(),flush=True)
            assert counter.inner_text()=='Foto 6 de 6'
            send('touchStart',[(cx-40,cy),(cx+40,cy)])
            send('touchMove',[(cx-100,cy),(cx+100,cy)])
            send('touchEnd',[])
            page.wait_for_timeout(180)
            transform=large.evaluate('(e)=>e.style.transform')
            print('ZOOM',transform,flush=True)
            assert 'scale(2.5)' in transform
            page.wait_for_function("""() => (document.querySelector('.vcc-mobile-photo-full')?.style.backgroundImage||'').includes('https://img.viajandoconcabeza.com/')""",timeout=18000)
            print('ORIGINAL_R2_ZOOM',large.evaluate('(e)=>e.style.backgroundImage'),flush=True)
            assert counter.inner_text()=='Foto 6 de 6'
            assert not errors,errors
            assert not failures,failures
            page.close()
            desktop=browser.new_page(viewport={'width':1440,'height':900})
            desktop.goto(url,wait_until='domcontentloaded',timeout=45000)
            desktop.wait_for_timeout(1400)
            desktop.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert desktop.locator('#vcc-desktop-gallery').is_visible()
            desktop.close();browser.close()
            print('PASS: live film swipes, rapid doubles, 2200px HQ, 4896px original on zoom, desktop preserved',flush=True)
          PY
