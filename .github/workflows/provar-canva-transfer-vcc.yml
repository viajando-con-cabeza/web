name: Prova transferència WebP VCC
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/provar-canva-transfer-vcc.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Comprovar mides originals recuperables sense comprometre la qualitat
        env:
          IMG_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F42b22ba2-cd08-434b-b614-3cbb76750439/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAF4WzEohSwmUCxWBlNXDEGzkePH57Qtzs2gm7L1xwNVe&exp=1794421330&osig=AAAAAAAAAAAAAAAAAAAAANfAh5Fe9_pL6-XNzst5AwDMDtKbAJq7HalkBRflOB03&signer=media-rpc&token=AAIAAU0AJDQyYjIyYmEyLWNkMDgtNDM0Yi1iNjE0LTNjYmI3Njc1MDQzOQAAAAABocvYkFDIw4chVPvUEKaYrCwFS28xg0nEVg&x-canva-quality=thumbnail"
        run: |
          python3 - <<'PY'
          import os,subprocess,re
          u=os.environ['IMG_URL']
          methods={
            'thumbnail': u,
            'full_res_webp': u.replace('format:JPG','format:WEBP').replace('height:112','height:941').replace('width:200','width:1672').replace('quality:75','quality:90'),
            'full_res_jpg':u.replace('height:112','height:941').replace('width:200','width:1672').replace('quality:75','quality:90'),
            'only_size':u.replace('height:112','height:941').replace('width:200','width:1672'),
            'no_size': re.sub(r'height:112/|width:200','',u).replace('format:JPG','format:WEBP'),
          }
          for key,url in methods.items():
            p=subprocess.run(['curl','-L','--silent','--show-error','--max-time','14','-w','HTTP:%{http_code} BYTES:%{size_download}\n','-o','/tmp/'+key,url],capture_output=True,text=True)
            f=subprocess.run(['file','-b','/tmp/'+key],capture_output=True,text=True)
            print(key,p.stdout.strip(),p.stderr[:100],f.stdout.strip()[:140])
          PY
