name: Verify filmstrip mobile photo swipe
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-mobile-film-swipe.yml']
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Chrome mobile gestures with intermediate positions, zoom and desktop regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          import time,re
          from playwright.sync_api import sync_playwright
          url='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            page=None; errors=[]; failed=[]
            for attempt in range(1,9):
              candidate=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              candidate.on('pageerror',lambda e:errors.append(str(e)))
              candidate.on('requestfailed',lambda r:failed.append((r.url,r.failure)) if '/optimizadas/' in r.url else None)
              response=candidate.goto(url+'?film-swipe-test='+str(attempt)+'-02e6ac',wait_until='domcontentloaded',timeout=45000)
              candidate.wait_for_timeout(1250)
              js=candidate.locator('script[src*="galeria-movil.js"]').get_attribute('src') or ''
              css=candidate.locator('link[href*="galeria-movil.css"]').get_attribute('href') or ''
              print('ATTEMPT',attempt,response.status,js,css,flush=True)
              if 'swipe-film-v5' in js and 'swipe-film-v5' in css:
                page=candidate;break
              candidate.close();time.sleep(6)
            assert page,'Film v5 not deployed'
            page.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            page.locator('.vcc-mobile-photo-tile').nth(2).click()
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            stage=page.locator('.vcc-mobile-photo-stage')
            large=page.locator('.vcc-mobile-photo-full')
            peek=page.locator('.vcc-mobile-photo-peek')
            assert peek.count()==1 and not peek.is_visible(),'Peek must be hidden when idle'
            rect=stage.bounding_box();cx=round(rect['x']+rect['width']/2);cy=round(rect['y']+rect['height']/2)
            cdp=page.context.new_cdp_session(page)
            def touch(t,points):
              cdp.send('Input.dispatchTouchEvent',{'type':t,'touchPoints':[{'x':round(x),'y':round(y)} for x,y in points]})
            def states():
              return page.evaluate("""() => {
                const large=document.querySelector('.vcc-mobile-photo-full');
                const peek=document.querySelector('.vcc-mobile-photo-peek');
                const sc=e=>getComputedStyle(e);
                return {main:large.style.transform,neighbor:peek.style.transform,
                  neighborUrl:peek.style.backgroundImage,hidden:peek.hidden,
                  transition:sc(large).transitionDuration,
                  scale:large.style.transform.match(/scale\(([\d.]+)\)/)?.[1] || null};
              }""")
            # Drag finger about 40% of width LEFT without releasing.
            touch('touchStart',[(cx+110,cy)])
            for x in (cx+80,cx+50,cx+20,cx-10,cx-45):
              touch('touchMove',[(x,cy)])
              page.wait_for_timeout(30)
            middle=states()
            print('LIVE_LEFT_DRAG',middle,flush=True)
            assert middle['hidden']==False
            assert 'DSC06558.webp' in middle['neighborUrl'],middle
            assert 'translate3d(-155px' in middle['main'],middle
            assert 'translate3d(235px' in middle['neighbor'],middle
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            # Release should animate the image out and finish on photo 4.
            touch('touchEnd',[])
            page.wait_for_timeout(35)
            moving=states()
            print('AFTER_RELEASE_ANIMATING',moving,flush=True)
            assert moving['hidden']==False,moving
            assert '0.23s' in moving['transition'],moving
            page.wait_for_timeout(390)
            after=states()
            print('LEFT_SWIPE_COMPLETE',after,page.locator('.vcc-photo-count').inner_text(),flush=True)
            assert after['hidden'] and page.locator('.vcc-photo-count').inner_text()=='Foto 4 de 6'
            # Right swipe, previous image should appear at left while dragging.
            touch('touchStart',[(cx-110,cy)])
            for x in (cx-70,cx-20,cx+50):
              touch('touchMove',[(x,cy)])
              page.wait_for_timeout(25)
            right=states()
            print('LIVE_RIGHT_DRAG',right,flush=True)
            assert not right['hidden']
            assert 'DSC06555.webp' in right['neighborUrl'],right
            assert 'translate3d(160px' in right['main'],right
            touch('touchEnd',[])
            page.wait_for_timeout(400)
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            # Partial swipe under threshold should spring back, no photo change.
            touch('touchStart',[(cx+60,cy)])
            touch('touchMove',[(cx+40,cy)])
            touch('touchEnd',[])
            page.wait_for_timeout(350)
            assert peek.evaluate('(e)=>e.hidden') and page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            # Pinch zoom, pan, reset, and swipe again.
            touch('touchStart',[(cx-55,cy),(cx+55,cy)])
            for d in (80,110,140):
              touch('touchMove',[(cx-d,cy),(cx+d,cy)])
              page.wait_for_timeout(30)
            touch('touchEnd',[])
            page.wait_for_timeout(150)
            pinch=states()
            print('PINCH',pinch,flush=True)
            assert float(pinch['scale'])>=2
            assert pinch['hidden'],pinch
            touch('touchStart',[(cx,cy)])
            touch('touchMove',[(cx+75,cy)])
            touch('touchEnd',[])
            page.wait_for_timeout(100)
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            for _ in range(2):
              touch('touchStart',[(cx,cy)]);touch('touchEnd',[])
              page.wait_for_timeout(80)
            page.wait_for_timeout(250)
            assert states()['scale']=='1',states()
            touch('touchStart',[(cx+110,cy)])
            touch('touchMove',[(cx-100,cy)])
            touch('touchEnd',[])
            page.wait_for_timeout(380)
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 4 de 6'
            # Close while stage idle, no page errors.
            page.locator('.vcc-mobile-photo-view [data-vcc-action="grid"]').click()
            assert page.locator('.vcc-mobile-grid-view').is_visible()
            assert not errors,errors
            assert not failed,failed
            page.close()
            desktop=browser.new_page(viewport={'width':1440,'height':900})
            desktop.goto(url+'?film-desktop-regression',wait_until='domcontentloaded',timeout=45000)
            desktop.wait_for_timeout(1500)
            desktop.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert desktop.locator('#vcc-desktop-gallery').is_visible()
            desktop.locator('#vcc-desktop-gallery .vcc-dg-tile').first.click()
            assert desktop.locator('#lightbox.open .lb-next').count()==1
            desktop.close();browser.close()
            print('PASS: live adjacent image follows drag, settles, bounces back, pinch zoom works; desktop unchanged')
          PY
