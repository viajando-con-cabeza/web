name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Block release to wrong Cloudflare Worker
        run: node configuracion/scripts/verificar-config-despliegue.mjs --main

      - name: Prevent draft indexing and ensure canonical release
        run: |
          npm run site:check
          node configuracion/scripts/comprobar-rutas.mjs

      - name: Validate real budget totals and contact email
        run: |
          node configuracion/scripts/verificar-presupuestos-vcc.mjs
          node configuracion/scripts/verificar-contacto-vcc.mjs

      - name: Check reusable CSS and absence of exact duplicates
        run: node configuracion/scripts/verificar-css-vcc.mjs

      - name: Audit all pages, shared assets and editorial links
        run: node configuracion/scripts/auditar-escalabilidad-vcc.mjs --strict-hubs

      - name: Check privacy policy is legally complete
        run: |
          if grep -q "Antes de publicar esta página de forma definitiva" politica-de-privacidad/index.html; then
            echo "BLOQUEADO: falta identificar al titular y completar la política legal antes de lanzar producción."
            exit 1
          fi

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Merge conflict markers found.'
            exit 1
          fi
          echo 'Production validation passed.'
