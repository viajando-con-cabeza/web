name: Verify desktop individual photo zoom
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-desktop-photo-zoom.yml']
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality
      - name: Test desktop photo click zoom, wheel, pan, navigation and mobile regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python -m http.server 9876 --bind 127.0.0.1 >/tmp/zoom-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python - <<'PY'
          import re,time
          from playwright.sync_api import sync_playwright
          base='http://127.0.0.1:9876/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            page=browser.new_page(viewport={'width':1440,'height':900},device_scale_factor=1)
            errs=[]; r2=[]
            page.on('pageerror',lambda e:errs.append(str(e)))
            page.on('response',lambda r:r2.append((r.status,r.url)) if 'img.viajandoconcabeza.com' in r.url else None)
            response=page.goto(base,wait_until='domcontentloaded',timeout=45000)
            assert response.status==200
            page.wait_for_timeout(1100)
            assert page.locator('script[src*="desktop-zoom-v12"]').count()==1
            page.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert page.locator('#vcc-desktop-gallery').is_visible()
            page.locator('#vcc-desktop-gallery .vcc-dg-tile').nth(1).click()
            lightbox=page.locator('#lightbox.open')
            photo=page.locator('#lightbox .lb-photo')
            zoom=page.locator('#lightbox .vcc-dg-zoom-layer')
            count=page.locator('#lightbox .lb-counter')
            assert lightbox.count()==1 and count.inner_text()=='2 / 6'
            assert zoom.count()==1
            before=page.evaluate("""() => {
              const e=document.querySelector('#lightbox .lb-photo'),z=e.querySelector('.vcc-dg-zoom-layer');
              return {cursor:getComputedStyle(e).cursor,overflow:getComputedStyle(e).overflow,
              zoomVisible:getComputedStyle(z).visibility,background:e.style.backgroundImage};
            }""")
            print('BEFORE_ZOOM',before,flush=True)
            assert before['cursor']=='zoom-in',before
            assert before['overflow']=='hidden',before
            assert before['zoomVisible']=='hidden'
            rect=photo.bounding_box();cx=rect['x']+rect['width']/2;cy=rect['y']+rect['height']/2
            page.mouse.click(cx,cy)
            page.wait_for_timeout(280)
            state=page.evaluate("""() => {
              const e=document.querySelector('#lightbox .lb-photo'),z=e.querySelector('.vcc-dg-zoom-layer');
              return {cls:e.className,transform:z.style.transform,visible:getComputedStyle(z).visibility,
                bg:z.style.backgroundImage,cursor:getComputedStyle(e).cursor,
                text:document.querySelector('#lightbox .lb-counter').textContent};
            }""")
            print('CLICK_ZOOM',state,flush=True)
            assert state['visible']=='visible' and 'scale(2.4)' in state['transform'],state
            assert state['cursor']=='grab',state
            assert count.inner_text()=='2 / 6','Photo click must ZOOM rather than advance'
            page.wait_for_function("""() => document.querySelector('#lightbox .vcc-dg-zoom-layer')?.style.backgroundImage.includes('img.viajandoconcabeza.com')""",timeout=25000)
            source=zoom.evaluate('(e)=>e.style.backgroundImage')
            print('R2_ORIGINAL_ZOOM',source,flush=True)
            assert 'DSC06554.webp' in source
            assert any(code==200 and 'DSC06554.webp' in u for code,u in r2),r2[-12:]
            # Wheel up zooms further, moving the mouse while dragged pans.
            page.mouse.move(cx,cy)
            page.mouse.wheel(0,-220)
            page.wait_for_timeout(120)
            tr=zoom.evaluate('(e)=>e.style.transform')
            print('WHEEL_ZOOM',tr,flush=True)
            assert float(re.search(r'scale\(([\d.]+)\)',tr).group(1))>2.4,tr
            page.mouse.move(cx,cy)
            page.mouse.down()
            page.mouse.move(cx-110,cy-85,steps=6)
            page.mouse.up()
            page.wait_for_timeout(120)
            trpan=zoom.evaluate('(e)=>e.style.transform')
            print('DRAG_PAN',trpan,flush=True)
            assert 'translate3d(0px,0px' not in trpan.replace(' ','') and 'scale(' in trpan,trpan
            assert count.inner_text()=='2 / 6'
            # Next image resets the zoom, then photo click again enlarges new image.
            page.locator('#lightbox .lb-next').click()
            page.wait_for_timeout(150)
            assert count.inner_text()=='3 / 6',count.inner_text()
            reset=page.evaluate("""()=>({transform:document.querySelector('#lightbox .vcc-dg-zoom-layer').style.transform,
              visible:getComputedStyle(document.querySelector('#lightbox .vcc-dg-zoom-layer')).visibility})""")
            print('NEXT_RESETS',reset,flush=True)
            assert reset['visible']=='hidden' and 'scale(1)' in reset['transform'],reset
            page.mouse.click(cx,cy)
            page.wait_for_timeout(220)
            assert 'scale(2.4)' in zoom.evaluate('(e)=>e.style.transform')
            # Click again resets zoom without advancing.
            page.mouse.click(cx,cy)
            page.wait_for_timeout(210)
            assert count.inner_text()=='3 / 6'
            assert zoom.evaluate('(e)=>getComputedStyle(e).visibility')=='hidden'
            page.locator('#lightbox .lb-thumbs button').nth(4).click()
            assert count.inner_text()=='5 / 6'
            assert zoom.evaluate('(e)=>getComputedStyle(e).visibility')=='hidden'
            page.locator('#lightbox .vcc-dg-photo-back').click()
            assert page.locator('#vcc-desktop-gallery').is_visible()
            page.locator('#vcc-desktop-gallery .vcc-dg-close').click()
            assert not page.locator('#vcc-desktop-gallery').is_visible()
            assert not errs,errs
            page.close()
            mobile=browser.new_page(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
            mobile.goto(base,wait_until='domcontentloaded',timeout=45000)
            mobile.wait_for_timeout(1500)
            mobile.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert mobile.locator('#vcc-mobile-gallery').is_visible()
            mobile.locator('.vcc-mobile-photo-tile').nth(1).click()
            assert mobile.locator('.vcc-mobile-photo-view').is_visible()
            assert mobile.locator('.vcc-mobile-photo-hint').count()==0
            mobile.close();browser.close()
            print('PASS_DESKTOP_ZOOM: click, wheel, pan, original R2, navigation, reset, mobile intact',flush=True)
          PY