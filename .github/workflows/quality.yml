name: Quality

on:
  push:
    branches:
      - quality
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality
  # The workflow pushes its generated files back to quality; do not cancel validation mid-run.
  cancel-in-progress: false

jobs:
  validate:
    name: Validate quality
    runs-on: ubuntu-latest
    environment: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: quality
          fetch-depth: 0

      - name: Generate Planifica hubs
        run: node configuracion/scripts/generate-planifica-hubs.mjs

      - name: Commit generated hubs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- planifica/presupuesto/index.html planifica/mapas/index.html planifica/que-llevar/index.html; then
            echo "Planifica hubs already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add planifica/presupuesto/index.html planifica/mapas/index.html planifica/que-llevar/index.html
            git commit -m "Auto-update Planifica hubs"
            git push origin HEAD:quality
          fi

      - name: Cache Destinos hero as WebP
        if: ${{ hashFiles('configuracion/imagenes/fondos/fondos-destinos.webp') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python configuracion/scripts/cache-destinos-background.py
          if ! git diff --quiet -- configuracion/imagenes/fondos/destinos-background.webp || [[ -n "$(git ls-files --others --exclude-standard -- configuracion/imagenes/fondos/destinos-background.webp)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add configuracion/imagenes/fondos/destinos-background.webp
            git commit -m "Guardar background de Destinos en WebP"
            git push origin HEAD:quality
          fi


      - name: Generate panoramic home hero WebP
        if: ${{ hashFiles('configuracion/imagenes/fondos/fondos-inicio.webp') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python configuracion/scripts/generate-inicio-hero-panoramico.py
          if ! git diff --quiet -- configuracion/imagenes/fondos/inicio-vcc-hero-panoramico.webp || [[ -n "$(git ls-files --others --exclude-standard -- configuracion/imagenes/fondos/inicio-vcc-hero-panoramico.webp)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add configuracion/imagenes/fondos/inicio-vcc-hero-panoramico.webp
            git commit -m "Generate full-width VCC Inici background"
            git push origin HEAD:quality
          fi

      - name: Cache subtle neutral suitcase photo as local WebP
        shell: bash
        run: |
          set -euo pipefail
          TARGET="configuracion/imagenes/ilustraciones/maleta-vcc-neutra-pexels.webp"
          if [[ -s "$TARGET" ]]; then
            echo "Neutral suitcase photo already cached in GitHub."
            exit 0
          fi
          python -m pip install --quiet Pillow
          curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 12 --max-time 90 \
            -A "ViajandoConCabeza/1.0 (travel-blog)" \
            'https://images.pexels.com/photos/8276910/pexels-photo-8276910.jpeg?auto=compress&cs=tinysrgb&w=1600' \
            -o /tmp/vcc-open-suitcase-source.jpg
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          path=Path("configuracion/imagenes/ilustraciones/maleta-vcc-neutra-pexels.webp")
          path.parent.mkdir(parents=True,exist_ok=True)
          with Image.open("/tmp/vcc-open-suitcase-source.jpg") as im:
              im=ImageOps.exif_transpose(im).convert("RGB")
              im.thumbnail((1400,1100),Image.Resampling.LANCZOS)
              if min(im.size) < 450:
                  raise ValueError("Source photo resolution is too low")
              im.save(path,"WEBP",quality=88,method=6)
              print("Saved",path,im.size,path.stat().st_size,"bytes")
          PY
          git add "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cache neutral suitcase photo locally for Qué llevar"
          git pull --rebase origin quality
          git push origin HEAD:quality

      - name: Optimize mountain background once (shared footer)
        shell: bash
        run: |
          set -euo pipefail
          TARGET="configuracion/imagenes/externas/unsplash/photo-1464822759023-fed622ff2c3b-vcc-optimizado.webp"
          if [[ -s "$TARGET" ]]; then
            echo "Optimized VCC mountains already committed."
          else
            python -m pip install --quiet Pillow
            python configuracion/scripts/optimizar-fondo-montanas.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$TARGET"
            git commit -m "Optimize mountain footer WebP without changing its design"
            git pull --rebase origin quality
            git push origin HEAD:quality
          fi

      - name: Sincronitzar SEO editorial, canòniques i pàgines noindex
        shell: bash
        run: |
          set -euo pipefail
          node configuracion/scripts/preparar-publicacion.mjs --write
          if ! git diff --quiet -- .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Auto-sync SEO editorial: canonicals, noindex and sitemap"
            git pull --rebase origin quality
            git push origin HEAD:quality
          fi
          node configuracion/scripts/preparar-publicacion.mjs --check

      - name: Check local links and resources
        run: node configuracion/scripts/comprobar-rutas.mjs

      - name: Validate shared SEO, canonical and sitemap
        run: node configuracion/scripts/verificar-seo-global.mjs

      - name: Validate Stockholm arrival SEO and staging noindex rules
        run: node configuracion/scripts/verificar-seo-como-llegar.mjs

      - name: Validate real budget totals and contact email
        run: |
          node configuracion/scripts/verificar-presupuestos-vcc.mjs
          node configuracion/scripts/verificar-contacto-vcc.mjs

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find configuracion/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check configuracion/scripts/actualizar-instagram.mjs

      - name: Validate Cuándo ir technical SEO
        run: node configuracion/scripts/verificar-seo-cuando-ir.mjs

      - name: Validate Stockholm 15 imprescindibles (SEO, galleries and map)
        run: node configuracion/scripts/verificar-imprescindibles-estocolmo.mjs

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)' --exclude-dir=.git .; then
            echo 'Merge conflict markers found.'
            exit 1
          fi
          echo 'Quality validation passed.'

      # Per provar la connexió abans de promoure-la a main:
      # Actions → Quality → Run workflow → quality.
      - name: Sincronitzar Instagram en execució manual (si està autoritzat)
        if: github.event_name == 'workflow_dispatch'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node configuracion/scripts/actualizar-instagram.mjs

      - name: Desar publicacions autoritzades a quality
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          FILE=configuracion/datos/instagram-ultimo.json
          if git diff --quiet -- "$FILE"; then
            echo "Instagram sense canvis / no autoritzat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Actualitzar prova Instagram a quality"
          git pull --rebase origin quality
          git push origin HEAD:quality
