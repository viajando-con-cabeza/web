name: Quality

on:
  push:
    branches:
      - quality
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality
  cancel-in-progress: true

jobs:
  validate:
    name: Validate quality
    runs-on: ubuntu-latest
    environment: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          if grep -RInE '^(<<<<<<< .+|=======$|>>>>>>> .+)' --exclude-dir=.git .; then
            echo 'Merge conflict markers found.'
            exit 1
          fi
          echo 'Quality validation passed.'
