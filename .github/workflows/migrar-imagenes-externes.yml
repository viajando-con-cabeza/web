name: Migrar imatges externes a quality
on:
  push:
    branches: [quality]
    paths:
      - 'configuracion/scripts/importar-imagenes-externas.py'
      - '.github/workflows/migrar-imagenes-externes.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: migrar-imatges-quality
  cancel-in-progress: false
jobs:
  migrar:
    if: github.ref == 'refs/heads/quality'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality
      - name: Descarregar i validar les fotos
        run: python3 configuracion/scripts/importar-imagenes-externas.py
      - name: Auditar rutes
        if: always()
        run: node configuracion/scripts/auditar-recursos.mjs --no-write
      - name: Publicar a quality
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configuracion/imagenes/externas/unsplash configuracion/datos/imagenes-externas-migrades.json
          git add -u '*.html' '*.css' '*.js' '*.mjs'
          if git diff --cached --quiet; then
            echo 'Sense canvis'; exit 0
          fi
          git commit -m 'assets: copiar fotografies externes a GitHub'
          git pull --rebase origin quality
          git push origin HEAD:quality
