name: Chrome LCP - cercar regla CSS

on:
  push:
    branches: [quality]
    paths: ['.github/workflows/lcp-regles-v4.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  css-props:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Provar scroll-snap i scroll-behavior de tots els CSS al primer render
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          import json,re
          from playwright.sync_api import sync_playwright
          base='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/'
          tests=['presupuesto','como-llegar','como-moverse','donde-dormir','que-llevar']
          cases=['base','proximity','none','auto','proximity_auto']
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox','--disable-dev-shm-usage'])
            for name in tests:
              for case in cases:
                page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=1,is_mobile=True,has_touch=True)
                page.add_init_script("""(()=>{window.__lcp=[];new PerformanceObserver(l=>{for(const e of l.getEntries())window.__lcp.push({tag:e.element?.tagName,size:e.size,time:Math.round(e.startTime)});}).observe({type:'largest-contentful-paint',buffered:true})})();""")
                changes=[0,0]
                if case!='base':
                  def handler(route):
                    if route.request.resource_type!='stylesheet':return route.continue_()
                    resp=route.fetch()
                    raw=resp.text()
                    if case in ('proximity','proximity_auto'):
                      raw,n=re.subn(r'scroll-snap-type\s*:\s*x\s+mandatory', 'scroll-snap-type:x proximity',raw,flags=re.I)
                      changes[0]+=n
                    elif case=='none':
                      raw,n=re.subn(r'scroll-snap-type\s*:\s*x\s+(?:mandatory|proximity)', 'scroll-snap-type:none',raw,flags=re.I)
                      changes[0]+=n
                    if case in ('auto','proximity_auto'):
                      raw,n=re.subn(r'scroll-behavior\s*:\s*smooth', 'scroll-behavior:auto',raw,flags=re.I)
                      changes[1]+=n
                    return route.fulfill(response=resp,body=raw,content_type='text/css')
                  page.route('**/*',handler)
                try:
                  r=page.goto(base+name+'?lcp_css_props_v6='+case,wait_until='domcontentloaded',timeout=32000)
                  page.wait_for_timeout(950)
                  out=page.evaluate("""()=>({lcp:window.__lcp,h:document.querySelector('#vcc-lcp-hero')?.getBoundingClientRect().height,paint:performance.getEntriesByType('paint').map(e=>Math.round(e.startTime))})""")
                  print('LCP6',json.dumps({'page':name,'case':case,'http':r.status if r else None,'changes':changes,**out},ensure_ascii=False),flush=True)
                except Exception as e:print('LCP6_ERROR',name,case,str(e)[:250],flush=True)
                page.close()
            browser.close()
          PY
