name: Check quality deploy credentials

on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/check-quality-deploy-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    environment: quality
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCOUNT: ${{ secrets.CF_ACCOUNT }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - name: Test deploy credentials without exposing secret values
        shell: bash
        run: |
          python - <<'PY'
          import os,urllib.request,json
          names=['CF_API_TOKEN','CLOUDFLARE_API_TOKEN','CLOUDFLARE_TOKEN','CF_ACCOUNT_ID','CLOUDFLARE_ACCOUNT_ID','CF_ACCOUNT','CF_ZONE_ID','CLOUDFLARE_ZONE_ID']
          for n in names:
            print(n+'_PRESENT',bool(os.environ.get(n)),flush=True)
          token=next((os.environ.get(n) for n in names[:3] if os.environ.get(n)),'')
          account=next((os.environ.get(n) for n in names[3:6] if os.environ.get(n)),'')
          if not (token and account):
            print('DEPLOY_ACCESS_AVAILABLE False',flush=True)
          else:
            for path in ['/pages/projects?per_page=50','/workers/scripts','/workers/domains']:
              url='https://api.cloudflare.com/client/v4/accounts/'+account+path
              try:
                req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
                with urllib.request.urlopen(req,timeout=20) as resp:
                  result=json.load(resp)
                print('CF_ENDPOINT',path,'SUCCESS',result.get('success'),flush=True)
                data=result.get('result') or []
                if isinstance(data,dict): data=data.get('items') or data.get('domains') or []
                for item in data:
                  if isinstance(item,dict):
                    print('CF_RESOURCE',path,'name',item.get('name') or item.get('script') or item.get('hostname'),'domains',item.get('domains'),flush=True)
              except Exception as e:
                print('CF_ENDPOINT_ERROR',path,type(e).__name__,getattr(e,'code',''),flush=True)
          PY
