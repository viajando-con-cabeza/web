name: Verify desktop lightbox strip count
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-desktop-strip.yml']
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Test thumbnails, count, bottom spacing, pointer and mobile regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          import time
          from playwright.sync_api import sync_playwright
          base='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            page=None
            errors=[]
            for attempt in range(1,7):
              candidate=browser.new_page(viewport={'width':1440,'height':900})
              candidate.on('pageerror',lambda error:errors.append(str(error)))
              response=candidate.goto(base+'?test-strip-v4='+str(attempt)+'-952e56',wait_until='domcontentloaded',timeout=45000)
              candidate.wait_for_timeout(1700)
              js=candidate.locator('script[src*="galeria-escritorio.js"]').get_attribute('src') or ''
              css=candidate.locator('link[href*="galeria-escritorio.css"]').get_attribute('href') or ''
              print('ATTEMPT',attempt,'STATUS',response.status,'CSS',css,'JS',js,flush=True)
              if 'strip-count-v4' in js and 'strip-count-v4' in css:
                page=candidate
                break
              candidate.close()
              time.sleep(6)
            assert page,'New desktop strip version not deployed'
            assert page.locator('.gallery-mosaic').count()==15
            # Gallery 06 includes 6 photos; photo 2 must read 2/6.
            page.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            grid=page.locator('#vcc-desktop-gallery')
            assert grid.is_visible()
            grid.locator('.vcc-dg-tile').nth(1).click()
            modal=page.locator('#lightbox.open')
            assert modal.count()==1
            thumbs=modal.locator('.lb-thumbs button')
            assert thumbs.count()==6,thumbs.count()
            count=modal.locator('.lb-counter').inner_text()
            computed=page.evaluate("""() => {
              const stage=document.querySelector('#lightbox .lb-stage');
              const strip=stage.querySelector('.lb-thumbs');
              const counter=stage.querySelector('.lb-counter');
              const photo=stage.querySelector('.lb-photo');
              const rect=strip.getBoundingClientRect();
              return {
                rows:getComputedStyle(stage).gridTemplateRows,
                counterDisplay:getComputedStyle(counter).display,
                thumbsDisplay:getComputedStyle(strip).display,
                paddingBottom:parseFloat(getComputedStyle(strip).paddingBottom),
                photoCursor:getComputedStyle(photo).cursor,
                stripWidth:rect.width,
                thumbWidth:strip.querySelector('button').getBoundingClientRect().width,
                photoWidth:photo.getBoundingClientRect().width,
                stageHeight:stage.getBoundingClientRect().height
              };
            }""")
            print('FIRST_PHOTO',count,'DATA',computed,flush=True)
            assert count=='2 / 6',count
            assert computed['counterDisplay']!='none'
            assert computed['thumbsDisplay']=='flex'
            assert computed['paddingBottom']>=25,computed
            assert computed['photoCursor']=='pointer',computed
            assert computed['photoWidth']>=500
            assert thumbs.nth(1).get_attribute('aria-pressed')=='true'
            thumbs.nth(4).click()
            assert modal.locator('.lb-counter').inner_text()=='5 / 6'
            assert thumbs.nth(4).get_attribute('aria-pressed')=='true'
            modal.locator('.lb-photo').click(position={'x':150,'y':160})
            assert modal.locator('.lb-counter').inner_text()=='6 / 6'
            assert modal.locator('.lb-place-info h3').inner_text().strip()=='Estocolmo desde las alturas'
            modal.locator('.vcc-dg-photo-back').click()
            assert grid.is_visible()
            grid.locator('.vcc-dg-close').click()
            # 10-photo gallery: dynamic 2 / 10.
            page.locator('.gallery').nth(14).locator('.gallery-tile').first.click()
            grid.locator('.vcc-dg-tile').nth(1).click()
            assert page.locator('#lightbox.open .lb-counter').inner_text()=='2 / 10'
            assert page.locator('#lightbox.open .lb-thumbs button').count()==10
            page.locator('#lightbox .vcc-dg-photo-back').click()
            grid.locator('.vcc-dg-close').click()
            # One photo hand cursor and return to grid.
            page.locator('.gallery').first.locator('.gallery-tile').first.click()
            grid.locator('.vcc-dg-tile').first.click()
            big=page.locator('#lightbox.open .lb-photo')
            assert big.evaluate('(e)=>getComputedStyle(e).cursor')=='pointer'
            big.click(position={'x':140,'y':130})
            assert not page.locator('#lightbox.open').count()
            assert grid.is_visible()
            assert not errors,errors
            page.close()
            mobile=browser.new_page(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
            mobile.goto(base+'?mobile-unchanged-strip',wait_until='domcontentloaded',timeout=45000)
            mobile.wait_for_timeout(1400)
            mobile.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert mobile.locator('#vcc-mobile-gallery').is_visible()
            mobile.locator('.vcc-mobile-photo-tile').first.click()
            assert mobile.locator('.vcc-mobile-photo-view').is_visible()
            mobile.close()
            browser.close()
            print('PASS desktop: 2/6,2/10, visible clickable thumbs, deep lower padding, pointer; mobile unchanged',flush=True)
          PY
