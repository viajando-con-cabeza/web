name: Auditar recursos visuals VCC
on:
  push:
    branches: [quality, main]
  pull_request:
    branches: [quality, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar rutes locals i manifest
        run: node configuracion/scripts/auditar-recursos.mjs --no-write
