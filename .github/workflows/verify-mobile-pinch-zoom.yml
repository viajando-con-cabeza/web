name: Verify mobile photo pinch zoom
on:
  push:
    branches: [quality]
    paths: ['.github/workflows/verify-mobile-pinch-zoom.yml']
jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Chrome mobile touch gestures, zoom, pan, swipe, desktop regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          import time,re
          from playwright.sync_api import sync_playwright
          base='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            page=None; errors=[]
            for attempt in range(1,9):
              candidate=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=2,is_mobile=True,has_touch=True)
              candidate.on('pageerror',lambda err:errors.append(str(err)))
              response=candidate.goto(base+'?pinch-zoom-check='+str(attempt)+'-b15233',wait_until='domcontentloaded',timeout=45000)
              candidate.wait_for_timeout(1300)
              src=candidate.locator('script[src*="imprescindibles-galeria-movil.js"]').get_attribute('src') or ''
              css=candidate.locator('link[href*="imprescindibles-galeria-movil.css"]').get_attribute('href') or ''
              print('ATTEMPT',attempt,'PAGE',response.status,'JS',src,'CSS',css,flush=True)
              if 'zoom-v4' in src and 'zoom-v4' in css:
                page=candidate;break
              candidate.close()
              time.sleep(6)
            assert page,'Zoom-v4 not yet deployed'
            page.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert page.locator('#vcc-mobile-gallery').is_visible()
            page.locator('.vcc-mobile-photo-tile').nth(2).click()
            assert page.locator('.vcc-mobile-photo-view').is_visible()
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            assert page.locator('.vcc-mobile-photo-arrow').count()==0
            photo=page.locator('.vcc-mobile-photo-full')
            stage=page.locator('.vcc-mobile-photo-stage')
            assert stage.evaluate('(e)=>getComputedStyle(e).touchAction')=='none'
            page.wait_for_timeout(750)
            cdp=page.context.new_cdp_session(page)
            rect=stage.bounding_box()
            cx=int(rect['x']+rect['width']/2)
            cy=int(rect['y']+rect['height']/2)
            def send(t,points):
              cdp.send('Input.dispatchTouchEvent',{'type':t,'touchPoints':[{'x':round(x),'y':round(y)} for x,y in points]})
            def scale():
              t=photo.evaluate('(e)=>e.style.transform')
              m=re.search(r'scale\(([\d.]+)\)',t)
              return float(m.group(1)) if m else None
            assert scale()==1,scale()
            # Spread two fingers for pinch zoom.
            send('touchStart',[(cx-52,cy),(cx+52,cy)])
            for d in (65,85,110,130):
              send('touchMove',[(cx-d,cy),(cx+d,cy)])
              page.wait_for_timeout(35)
            send('touchEnd',[])
            page.wait_for_timeout(160)
            print('AFTER_PINCH',scale(),photo.evaluate('(e)=>e.style.transform'),flush=True)
            assert scale()>=2,scale()
            assert stage.evaluate('(e)=>e.classList.contains("is-zoomed")')
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            # Pan a zoomed image; photo number must not change.
            send('touchStart',[(cx,cy)])
            send('touchMove',[(cx+75,cy)])
            send('touchEnd',[])
            page.wait_for_timeout(150)
            transform=photo.evaluate('(e)=>e.style.transform')
            print('AFTER_PAN',transform,flush=True)
            assert 'translate3d(0px' not in transform,transform
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 3 de 6'
            # Double tap while zoomed resets to normal.
            for i in range(2):
              send('touchStart',[(cx,cy)])
              send('touchEnd',[])
              page.wait_for_timeout(90)
            page.wait_for_timeout(350)
            print('AFTER_DOUBLE_TAP_RESET',scale(),flush=True)
            assert scale()==1,scale()
            # Now swipe to the next image.
            send('touchStart',[(cx+125,cy)])
            for x in (cx+90,cx+50,cx+10,cx-45,cx-100):
              send('touchMove',[(x,cy)])
              page.wait_for_timeout(18)
            send('touchEnd',[])
            page.wait_for_timeout(350)
            print('AFTER_SWIPE',page.locator('.vcc-photo-count').inner_text(),scale(),flush=True)
            assert page.locator('.vcc-photo-count').inner_text()=='Foto 4 de 6'
            assert scale()==1
            # Double tap from unzoomed zooms back in.
            for i in range(2):
              send('touchStart',[(cx,cy)])
              send('touchEnd',[])
              page.wait_for_timeout(85)
            page.wait_for_timeout(200)
            print('AFTER_DOUBLE_TAP_ZOOM',scale(),flush=True)
            assert scale()>=2,scale()
            page.locator('.vcc-mobile-photo-view [data-vcc-action="grid"]').click()
            assert page.locator('.vcc-mobile-grid-view').is_visible()
            page.locator('.vcc-mobile-photo-tile').first.click()
            assert scale()==1,'Zoom state should reset when opening another photo'
            assert not errors,errors
            page.close()
            desk=browser.new_page(viewport={'width':1440,'height':900})
            desk.goto(base+'?desktop-zoom-regression',wait_until='domcontentloaded',timeout=45000)
            desk.wait_for_timeout(1200)
            desk.locator('.gallery').nth(5).locator('.gallery-tile').first.click()
            assert desk.locator('#vcc-desktop-gallery').is_visible()
            desk.locator('#vcc-desktop-gallery .vcc-dg-tile').first.click()
            assert desk.locator('#lightbox.open .lb-next').count()==1
            desk.close()
            browser.close()
            print('PASS: mobile pinch zoom, pan, double tap, swipe after reset; desktop unchanged',flush=True)
          PY
