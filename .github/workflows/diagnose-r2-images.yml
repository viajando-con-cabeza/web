name: Diagnose deployed image path
on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/diagnose-r2-images.yml'
jobs:
  read-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check HTML served by Cloudflare quality
        shell: bash
        run: |
          set -euo pipefail
          for variant in normal bust; do
            url='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
            if [ "$variant" = bust ]; then url="$url?verify-r2=3f22262a"; fi
            curl -sSL --max-time 25 "$url" -o /tmp/test.html
            echo "::group::"$variant
            grep -oE 'const R2_GOTEBORG[^;]+;' /tmp/test.html || true
            grep -oE 'imprescindibles-interactions.js\?v=[^"]+' /tmp/test.html | head -n 1 || true
            echo "::endgroup::"
          done
