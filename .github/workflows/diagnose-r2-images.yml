name: Final verification of all ten R2 images
on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/diagnose-r2-images.yml'
jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - name: Download all R2 WebP files and verify content hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/r2-images
          base='https://img.viajandoconcabeza.com/destinos/suecia/goteborg/2026-dia1'
          for n in 06553 06554 06555 06558 06560 06564 06576 06578 06585 06588; do
            file="DSC$n.webp"
            code=$(curl -sSL --fail --max-time 30 -o "/tmp/r2-images/$file" -w '%{http_code}' "$base/$file")
            printf '%s %s bytes=%s magic=%s\n' "$file" "$code" "$(stat -c '%s' "/tmp/r2-images/$file")" "$(file -b --mime-type "/tmp/r2-images/$file")"
            test "$code" = 200
            test "$(file -b --mime-type "/tmp/r2-images/$file")" = image/webp
          done
          python - <<'PY'
          import hashlib,glob
          files=sorted(glob.glob('/tmp/r2-images/*'))
          hashes=[hashlib.sha256(open(f,'rb').read()).hexdigest() for f in files]
          print('WEBP_FILES',len(files),'DISTINCT_HASHES',len(set(hashes)))
          assert len(files)==10 and len(set(hashes))==10
          PY
