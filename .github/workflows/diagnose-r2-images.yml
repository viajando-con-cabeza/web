name: Diagnose R2 source HTML
on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/diagnose-r2-images.yml'
jobs:
  check-html:
    runs-on: ubuntu-latest
    steps:
      - name: Compare deployed inline R2 URL with R2 object
        shell: bash
        run: |
          set -euo pipefail
          page='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
          echo '=== Deployed HTML R2 lines ==='
          curl -sSL --max-time 25 "$page" -o /tmp/quality.html
          grep -oE '.{0,80}R2_GOTEBORG.{0,150}' /tmp/quality.html | head -n 6 || true
          grep -oE '.{0,80}2026-dia1.{0,80}' /tmp/quality.html | head -n 3 || true
          grep -oE '.{0,80}goteborg/-dia1.{0,100}' /tmp/quality.html | head -n 3 || true
          echo '=== Deployed HTML version ==='
          grep -o 'imprescindibles-interactions.js?v=[^"]*' /tmp/quality.html | head -n 2 || true
          echo '=== Cloudflare response for wrong path ==='
          curl -Ls -o /dev/null -w '%{http_code} %{content_type}\n' 'https://img.viajandoconcabeza.com/destinos/suecia/goteborg/-dia1/DSC06553.webp'
