name: Verify fixed R2 gallery in Chrome
on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/diagnose-r2-images.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed quality version, R2 requests, and mosaic backgrounds
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True, executable_path='/usr/bin/google-chrome',args=['--no-sandbox'])
            base='https://www.quality.viajandoconcabeza.com/destinos/suecia/estocolmo/imprescindibles.html'
            for attempt in range(1,5):
              page=browser.new_page()
              responses=[]
              failures=[]
              page.on('response',lambda r:responses.append((r.status,r.url)) if 'DSC065' in r.url else None)
              page.on('requestfailed',lambda r:failures.append((r.url,r.failure)) if 'DSC065' in r.url else None)
              page.goto(base + '?check-r2-version=' + str(attempt) + '-e2a974',wait_until='domcontentloaded',timeout=35000)
              page.wait_for_timeout(6000)
              version=page.locator('script[src*="imprescindibles-interactions"]').get_attribute('src')
              prefix=page.evaluate('R2_GOTEBORG')
              first=page.locator('.gallery-tile').first.evaluate('(e)=>e.style.backgroundImage')
              print('ATTEMPT',attempt,'JS',version,'BASE',prefix,'FIRST_TILE',first,flush=True)
              print('PHOTO_RESPONSES',responses[:15],flush=True)
              print('FAILED',failures[:15],flush=True)
              page.close()
              if 'r2-path-fixed-v13' in version and '/2026-dia1/' in first:
                print('VERIFIED_CORRECT_PATH',True,flush=True)
                break
              if attempt < 4: import time;time.sleep(9)
            browser.close()
          PY
