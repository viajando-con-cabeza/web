name: Vectoritzar transports VCC amb traçat real

on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/vectoritzar-transportes.yml'

permissions:
  contents: write

concurrency:
  group: vcc-vectoritzar-transportes
  cancel-in-progress: false

jobs:
  vectorize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quality
        uses: actions/checkout@v4
        with:
          ref: quality
          fetch-depth: 0
      - name: Install vectorization tools
        run: python -m pip install --quiet Pillow cairosvg vtracer
      - name: Trace original images as genuine vector SVGs
        run: python configuracion/scripts/vectoritzar-transportes-originales.py
      - name: Validate all local links and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node configuracion/scripts/comprobar-rutas.mjs
          find configuracion/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit verified SVGs to quality only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configuracion/imagenes/ilustraciones/transportes/transporte-{avion,tren,ferry,autobus,coche}.svg
          git add destinos/suecia/estocolmo/como-llegar.html configuracion/css/plantillas/como-llegar-vcc.css
          if git diff --cached --quiet; then
            echo "No differences."
          else
            git commit -m "Vectorizar realmente ilustraciones de transporte originales"
            git pull --rebase origin quality
            git push origin HEAD:quality
          fi
