name: Verify Sweden editorial images live

on:
  push:
    branches: [quality]
    paths:
      - '.github/workflows/verify-suecia-editorial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Compare public Sweden page with editorial images in quality
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, datetime, re, hashlib
          base='https://www.quality.viajandoconcabeza.com'
          paths=[
            '/destinos/suecia/',
            '/configuracion/js/paises/suecia.js',
            '/configuracion/js/paises/suecia-page.js',
            '/configuracion/imagenes/fondos/fondos-como-moverse-editorial.webp',
            '/configuracion/imagenes/fondos/fondos-que-llevar-editorial.webp',
            '/configuracion/imagenes/fondos/fondos-donde-dormir-editorial.webp',
          ]
          checks=['fondos-como-moverse-editorial.webp','fondos-que-llevar-editorial.webp','fondos-donde-dormir-editorial.webp']
          results={}
          for path in paths:
            try:
              nonce=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d%H%M%S%f')
              url=base+path+('?check='+nonce)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 VCC-Live-Check','Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as response:
                data=response.read()
                headers=response.headers
                print('URL',path,'STATUS',response.status,'LENGTH',len(data),'CACHE',headers.get('CF-Cache-Status'),'AGE',headers.get('Age'),'ETAG',headers.get('ETag'),'SHA256',hashlib.sha256(data).hexdigest()[:16],flush=True)
                results[path]=data
            except Exception as e:
              print('ERROR',path,type(e).__name__,str(e)[:220],flush=True)
          html=results.get('/destinos/suecia/',b'').decode('utf-8','replace')
          data=results.get('/configuracion/js/paises/suecia.js',b'').decode('utf-8','replace')
          render=results.get('/configuracion/js/paises/suecia-page.js',b'').decode('utf-8','replace')
          print('HTML_SCRIPT_VERSIONS',re.findall(r'suecia(?:-page)?\\.js\\?v=[a-zA-Z0-9-]+',html))
          print('HTML_USES_PREP_BACKGROUND_CSS','background-image:var(--vcc-prep-photo)' in html)
          print('RENDER_USES_PREP_IMAGE_VAR','--vcc-prep-photo' in render)
          for asset in checks:
            print('LIVE_JS_REFERENCES',asset,asset in data)
          print('LIVE_JS_LENGTH',len(data),'LIVE_HTML_LENGTH',len(html))
          if not all(n in data for n in checks) or not ('--vcc-prep-photo' in render and 'background-image:var(--vcc-prep-photo)' in html):
            print('RESULT: Live deployment is missing at least one of the expected code changes.')
          else:
            print('RESULT: Live code references all three editorial assets.')
          PY
