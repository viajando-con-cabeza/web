name: "VCC - Recuperar portada presupuesto aprovada (un sol ús)"
on:
  push:
    branches: [quality]
    paths:
      - ".github/workflows/vcc-publicar-presupuesto-aprovat.yml"
permissions:
  contents: write
concurrency:
  group: vcc-restore-presupuesto-image
  cancel-in-progress: false
jobs:
  recover-approved-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quality
          fetch-depth: 0
      - name: Instal·lar Pillow
        run: python -m pip install --quiet Pillow requests
      - name: Recuperar original a resolució completa
        env:
          CANVA_PREVIEW: 'https://media.canva.com/v2/image-resize/format:JPG/height:100/quality:75/uri:ifs%3A%2F%2FM%2Fe8a53778-974c-4658-a94a-0c9bdec3f7ad/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAFcKR05QfBgMDESDwVkwVICcHBawhqZz_XnZm2mI-pP3&exp=1794430994&osig=AAAAAAAAAAAAAAAAAAAAABV5Ev0MVQyCHn31xBm55OdBYjDAG_EIPxXSIbZfqnWK&signer=media-rpc&token=AAIAAU0AJGU4YTUzNzc4LTk3NGMtNDY1OC1hOTRhLTBjOWJkZWMzZjdhZAAAAAABocxsBlAQxZ6RlvDLTINYfDH4obdeh2x2z6U0-UWFlefC6QKSCw&x-canva-quality=thumbnail'
        run: |
          python - <<'PY'
          from urllib.parse import urlparse, urlunparse
          from PIL import Image
          import requests,io,os
          preview=os.environ["CANVA_PREVIEW"]
          u=urlparse(preview)
          source=u.path
          variants=[
            source.replace('/format:JPG/height:100/quality:75/', '/format:WEBP/height:1500/quality:90/').replace('/width:200','/width:3000'),
            source.replace('/format:JPG/height:100/quality:75/', '/format:JPG/height:1500/quality:95/').replace('/width:200','/width:3000'),
            source.replace('/format:JPG/height:100/quality:75/', '/format:WEBP/height:1500/quality:85/').replace('/width:200','/width:3000'),
            source
          ]
          success=False
          for i,path in enumerate(variants,1):
            url=urlunparse((u.scheme,u.netloc,path,'',u.query,''))
            try:
              r=requests.get(url,timeout=25)
              print(f'Canva variant {i}: HTTP {r.status_code}, {len(r.content)} bytes')
              if r.status_code != 200: continue
              image=Image.open(io.BytesIO(r.content))
              print(f'Dimensions: {image.width} × {image.height}')
              if image.width<2200 or image.height<1100:
                continue
              image.convert('RGB').save('configuracion/imagenes/fondos/fondos-presupuesto.webp',format='WEBP',quality=92,method=6)
              success=True
              break
            except Exception as exc: print(f'Variant {i}: {type(exc).__name__} {str(exc)[:130]}')
          if not success:
            raise SystemExit('No s’ha trobat la versió completa; no substituïm el WebP actual.')
          PY
      - name: Publicar únicament la portada a quality
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configuracion/imagenes/fondos/fondos-presupuesto.webp
          if git diff --cached --quiet; then
            echo "La portada ja coincideix."
          else
            git commit -m "assets: substituir fondos-presupuesto per versió aprovada sense destí"
            git pull --rebase origin quality
            git push origin HEAD:quality
          fi
