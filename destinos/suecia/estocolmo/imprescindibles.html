<script>
const IMG={old:'https://images.unsplash.com/photo-1520769669658-f07657f5a307?auto=format&fit=crop&w=1200&q=88',city:'https://images.unsplash.com/photo-1509356843151-3e7d96241e11?auto=format&fit=crop&w=1200&q=88',green:'https://images.unsplash.com/photo-1517825738774-7de9363ef735?auto=format&fit=crop&w=1200&q=88',water:'https://images.unsplash.com/photo-1534274988757-a28bf1a57c17?auto=format&fit=crop&w=1200&q=88'};
const places=[
{id:'gamla-stan',name:'GAMLA STAN',sub:'EL CORAZÓN DE ESTOCOLMO',text:'Calles empedradas, fachadas de colores y siglos de historia. Gamla Stan es el alma de Estocolmo y uno de los cascos antiguos mejor conservados de Europa. Pasear sin prisa por sus callejuelas es parte de la experiencia.',loc:'Estocolmo',time:'2–3 horas',rate:5,label:'Imprescindible',note:'Calles con historia',tip:'Ve temprano o al atardecer para disfrutarlo con menos gente y una luz mágica.',img:'old'},
{id:'vasa',name:'MUSEO VASA',sub:'UN BARCO, UNA HISTORIA EXTRAORDINARIA',text:'El Vasa es uno de esos museos que justifican por sí solos una visita. El barco del siglo XVII fue rescatado 333 años después de hundirse y hoy permite entender una parte fascinante de la historia marítima sueca.',loc:'Djurgården',time:'2–3 horas',rate:4,label:'Muy recomendable',note:'Una historia que impresiona',tip:'Compra la entrada online para evitar colas, especialmente en temporada alta.',img:'city'},
{id:'djurgarden',name:'DJURGÅRDEN',sub:'NATURALEZA, MUSEOS Y AMBIENTE LOCAL',text:'Una isla verde en pleno corazón de la ciudad, perfecta para pasear, disfrutar de la naturaleza y combinar algunos de los museos más importantes de Estocolmo.',loc:'Estocolmo',time:'2–4 horas',rate:4,label:'Muy recomendable',note:'Naturaleza a un paso de la ciudad',tip:'Alquila una bicicleta o recórrela caminando sin prisas: aquí merece la pena bajar el ritmo.',img:'green'},
{id:'ayuntamiento',name:'AYUNTAMIENTO',sub:'UN ICONO JUNTO AL AGUA',text:'El Ayuntamiento de Estocolmo es uno de los edificios más reconocibles de la ciudad y escenario de los Premios Nobel. El entorno junto al lago Mälaren merece también el paseo.',loc:'Kungsholmen',time:'1–2 horas',rate:5,label:'Imprescindible',note:'Vistas que no se olvidan',tip:'Si puedes, haz la visita guiada para conocer su historia y acceder a las salas interiores.',img:'water'},
{id:'sodermalm',name:'SÖDERMALM',sub:'EL ESTOCOLMO MÁS LOCAL',text:'Cafés, tiendas, calles tranquilas y miradores. Södermalm aporta un contrapunto perfecto al centro histórico y es uno de nuestros barrios favoritos para pasear.',loc:'Södermalm',time:'2–4 horas',rate:4,label:'Muy recomendable',note:'Estocolmo con otro ritmo',tip:'Combínalo con Monteliusvägen y quédate hasta el atardecer.',img:'city'},
{id:'montelius',name:'MONTELIUSVÄGEN',sub:'UNA DE LAS VISTAS MÁS BONITAS',text:'Un paseo corto sobre Södermalm con una panorámica fantástica de Gamla Stan, Riddarholmen y el agua. Fácil de encajar en casi cualquier ruta.',loc:'Södermalm',time:'30–45 min',rate:4,label:'Muy recomendable',note:'La ciudad desde arriba',tip:'Guárdalo para última hora de la tarde si buscas la mejor luz.',img:'water'},
{id:'stortorget',name:'STORTORGET',sub:'LA PLAZA MÁS ICÓNICA',text:'El corazón visual de Gamla Stan. Sus fachadas de colores son una de las imágenes más reconocibles de Estocolmo y una parada natural mientras recorres el casco antiguo.',loc:'Gamla Stan',time:'20–30 min',rate:4,label:'Muy recomendable',note:'Una postal de Estocolmo',tip:'Pasa temprano si quieres verla con menos gente.',img:'old'},
{id:'riddarholmen',name:'RIDDARHOLMEN',sub:'AGUA, HISTORIA Y CALMA',text:'A pocos minutos de Gamla Stan, esta pequeña isla ofrece algunos de los rincones más tranquilos del centro y muy buenas vistas hacia el Ayuntamiento.',loc:'Centro',time:'45–60 min',rate:3,label:'Recomendable',note:'Un rincón para parar',tip:'Únelo a Gamla Stan: no necesita un desplazamiento específico.',img:'city'},
{id:'metro',name:'METRO DE ESTOCOLMO',sub:'ARTE BAJO TIERRA',text:'Varias estaciones funcionan casi como una galería de arte. No hace falta recorrerlas todas: selecciona unas pocas e intégralas en tus trayectos reales.',loc:'Varias zonas',time:'1–2 horas',rate:3,label:'Recomendable',note:'El viaje también cuenta',tip:'Prioriza T-Centralen, Stadion y Kungsträdgården.',img:'old'},
{id:'ferry',name:'PASEO EN FERRY',sub:'ESTOCOLMO DESDE EL AGUA',text:'En una ciudad construida sobre islas, verla desde el agua cambia completamente la perspectiva. Algunos ferris forman parte del transporte público y encajan muy bien en la ruta.',loc:'Archipiélago urbano',time:'1–2 horas',rate:4,label:'Muy recomendable',note:'La ciudad entre islas',tip:'Haz coincidir el trayecto con un desplazamiento para aprovechar mejor el tiempo.',img:'water'}];
function rating(n){return `<span class="vcc-rating r${n}" aria-label="${n} de 5"><i></i><i></i><i></i><i></i><i></i></span>`}
function gallery(p){let keys=[p.img,'city','old','green','water'].filter((v,i,a)=>a.indexOf(v)===i);while(keys.length<5)keys.push('city');return keys.map(k=>IMG[k])}
const main=document.querySelector('#places');main.innerHTML=places.map(p=>{let g=gallery(p);return `<section class="place" id="${p.id}" data-name="${p.name}"><div class="gallery"><div class="gallery-main" data-images='${JSON.stringify(g)}'><img src="${g[0]}" alt="${p.name}, Estocolmo"><span class="photo-note">${p.note}</span><span class="photo-count">1 / ${g.length}</span></div><div class="thumbs">${g.map((u,i)=>`<button data-i="${i}" aria-label="Foto ${i+1} de ${p.name}"><img src="${u}" alt=""></button>`).join('')}</div></div><div class="place-copy"><h2>${p.name}</h2><div class="place-kicker">${p.sub}</div><p>${p.text}</p><div class="facts"><span><b class="ico">●</b>${p.loc}</span><span><b class="ico">◷</b>${p.time}</span><span>${rating(p.rate)} ${p.label}</span></div><div class="advice"><div class="paper-plane">➤</div><div><b>CONSEJO VCC</b><p>${p.tip}</p></div></div><a class="map-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' Stockholm')}" target="_blank" rel="noopener">VER EN GOOGLE MAPS <span>→</span></a></div></section>`}).join('')+`<section class="closing"><div><strong>¿Listo para descubrir Estocolmo?</strong><div>Consulta nuestro itinerario de 3 días, mapa, presupuesto y todos los consejos.</div></div><a href="itinerario.html?dias=3">VER GUÍA COMPLETA →</a></section>`;
const lb=document.querySelector('#lightbox'),lbImg=lb.querySelector('img'),cap=lb.querySelector('.lb-caption');let current=[],idx=0,title='';function show(){lbImg.src=current[idx];cap.textContent=`${idx+1} / ${current.length} · ${title}`}
document.querySelectorAll('.gallery').forEach(g=>{const box=g.querySelector('.gallery-main'),arr=JSON.parse(box.dataset.images),hero=box.querySelector('img'),count=box.querySelector('.photo-count');g.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;hero.src=arr[i];count.textContent=`${i+1} / ${arr.length}`});box.onclick=()=>{current=arr;idx=Math.max(0,arr.indexOf(hero.src));title=g.closest('.place').dataset.name;lb.classList.add('open');lb.setAttribute('aria-hidden','false');show()}});
lb.querySelector('.lb-close').onclick=()=>{lb.classList.remove('open');lb.setAttribute('aria-hidden','true')};lb.querySelector('.lb-prev').onclick=()=>{idx=(idx-1+current.length)%current.length;show()};lb.querySelector('.lb-next').onclick=()=>{idx=(idx+1)%current.length;show()};lb.onclick=e=>{if(e.target===lb)lb.querySelector('.lb-close').click()};document.addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.querySelector('.lb-close').click();if(e.key==='ArrowRight')lb.querySelector('.lb-next').click();if(e.key==='ArrowLeft')lb.querySelector('.lb-prev').click()});
const navLinks=[...document.querySelectorAll('.place-nav a')];const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){navLinks.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id));let a=navLinks.find(a=>a.classList.contains('active'));a&&a.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}}),{rootMargin:'-25% 0px -60% 0px'});document.querySelectorAll('.place').forEach(s=>obs.observe(s));
</script>
