  <text x="94" y="92" fill="#151515" font-family="Brush Script MT,Segoe Script,cursive" font-size="64" font-style="italic">con cabeza</text>
  <text x="0" y="255" fill="#d78473" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="500" letter-spacing="3">PRÓXIMAMENTE</text>
