<path d="M584 270h33l3 10h-32Z" fill="#FFF7DA" stroke="#5F7770" stroke-width="2"/>
<path d="m586 302 26 2" stroke="#37585C" stroke-width="4" stroke-linecap="round"/>
<path d="M65 280h20l-3 13-17 3" fill="#EFC7A1" stroke="#5A706D" stroke-width="2"/>
