<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="Coche de viaje">
<title>Coche de viaje · Ilustración editorial vectorial de Viajando con Cabeza</title>
<defs>
<linearGradient id="pearl" x1="0.05" y1="0" x2="0.28" y2="1"><stop stop-color="#FFFCF5"/><stop offset=".48" stop-color="#E7ECE7"/><stop offset=".83" stop-color="#C6D2CB"/><stop offset="1" stop-color="#A4B7B0"/></linearGradient>
<linearGradient id="ivory" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#FFFEF9"/><stop offset=".55" stop-color="#F2EFE5"/><stop offset="1" stop-color="#CDCFC5"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#E3A98B"/><stop offset=".52" stop-color="#C87A5C"/><stop offset="1" stop-color="#9F5543"/></linearGradient>
<linearGradient id="darkcopper" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#C78063"/><stop offset="1" stop-color="#7E4B42"/></linearGradient>
<linearGradient id="forest" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#6F9A91"/><stop offset=".52" stop-color="#395F5A"/><stop offset="1" stop-color="#223F42"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#BFD9D6"/><stop offset=".27" stop-color="#7FA7AC"/><stop offset=".6" stop-color="#426B78"/><stop offset="1" stop-color="#273E4B"/></linearGradient>
<linearGradient id="glassdeep" x1=".1" y1="0" x2=".7" y2="1"><stop stop-color="#547D88"/><stop offset=".55" stop-color="#294956"/><stop offset="1" stop-color="#1D333F"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#84B9B7"/><stop offset=".55" stop-color="#48858B"/><stop offset="1" stop-color="#356A76"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DFE7DE"/><stop offset=".46" stop-color="#9CB3B1"/><stop offset=".62" stop-color="#F6F6EC"/><stop offset="1" stop-color="#A1A9A1"/></linearGradient>
<radialGradient id="ground"><stop stop-color="#304747" stop-opacity=".24"/><stop offset="1" stop-color="#304747" stop-opacity="0"/></radialGradient>
<radialGradient id="flare"><stop stop-color="#E8D2AD" stop-opacity=".34"/><stop offset="1" stop-color="#E8D2AD" stop-opacity="0"/></radialGradient>
<filter id="cast" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<ellipse cx="356" cy="368" rx="282" ry="18" fill="url(#ground)"/>

<!-- subtle horizon route mark -->
