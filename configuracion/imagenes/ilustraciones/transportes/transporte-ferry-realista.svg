<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Ferri de pasajeros del mar Báltico"><title>Ferri de pasajeros del mar Báltico · Ilustración vectorial VCC</title>
<defs>
<linearGradient id="body" x1=".15" y1="0" x2=".3" y2="1"><stop stop-color="#FEFDF7"/><stop offset=".28" stop-color="#F1F1E9"/><stop offset=".57" stop-color="#D6DEDB"/><stop offset=".86" stop-color="#F3F1E8"/><stop offset="1" stop-color="#ADBDB7"/></linearGradient>
<linearGradient id="bodyDeep" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#F9F6EC"/><stop offset=".45" stop-color="#DBE3DE"/><stop offset="1" stop-color="#94ABA6"/></linearGradient>
<linearGradient id="cab" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#95B9B6"/><stop offset=".24" stop-color="#4D7882"/><stop offset=".66" stop-color="#244550"/><stop offset="1" stop-color="#182F3B"/></linearGradient>
<linearGradient id="cab2" x1=".1" y1="0" x2=".5" y2="1"><stop stop-color="#CDE2DB"/><stop offset=".4" stop-color="#76A9AE"/><stop offset="1" stop-color="#335B68"/></linearGradient>
<linearGradient id="terra" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#DF9D80"/><stop offset=".44" stop-color="#C77659"/><stop offset="1" stop-color="#925345"/></linearGradient>
<linearGradient id="terraLight" x1=".1" y1="0" x2=".1" y2="1"><stop stop-color="#E2B99E"/><stop offset="1" stop-color="#BD765E"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#74A9AC"/><stop offset="1" stop-color="#2C646E"/></linearGradient>
<linearGradient id="steel" x1=".2" y1="0" x2=".7" y2="1"><stop stop-color="#EAF1E9"/><stop offset=".2" stop-color="#BACCC6"/><stop offset=".58" stop-color="#849A96"/><stop offset=".8" stop-color="#E1E7DC"/><stop offset="1" stop-color="#7A948F"/></linearGradient>
<linearGradient id="wheel" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#354349"/><stop offset=".65" stop-color="#182A32"/><stop offset="1" stop-color="#49545A"/></linearGradient>
<radialGradient id="shade"><stop stop-color="#506866" stop-opacity=".22"/><stop offset="1" stop-color="#506866" stop-opacity="0"/></radialGradient>
</defs>

<!-- Baltic ferry: bridge forward, lifeboats upper deck, hull below -->
<ellipse cx="357" cy="362" rx="290" ry="14" fill="url(#shade)"/>
<!-- bridge mast, navigation lights and radar -->
<g fill="none" stroke="#567471" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"><path d="M480 143V72m0 16h29m-46-24h33m-26 0v9"/><path d="M478 85 455 126m26-41 33 49"/></g>
<ellipse cx="478" cy="63" rx="15" ry="4" fill="#CBD9CC" stroke="#6B8780" stroke-width="1.8"/>
<path d="M481 74h10v6h-10" fill="#C98365"/>
<!-- smokestack offset astern -->
<path d="M230 116h40l7 44h-57Z" fill="url(#terra)" stroke="#6E7770" stroke-width="2.7"/>
<path d="M233 115h34" stroke="#2D4B50" stroke-width="8"/>
<!-- multi-deck superstructure -->
<path d="M183 166h350l44 26-5 56H123l13-48q9-24 47-34Z" fill="url(#body)" stroke="#67827C" stroke-width="2.8" stroke-linejoin="round"/>
<path d="M216 141h248q40 0 57 23l13 24H176l13-28q8-18 27-19Z" fill="url(#body)" stroke="#698782" stroke-width="2.4"/>
<!-- real forward wheelhouse with sloping windows -->
<path d="M475 132h63q29 1 49 22l18 24-89 7-44-15Z" fill="url(#bodyDeep)" stroke="#587B78" stroke-width="2.4"/>
<path d="M491 144h46q21 3 35 19l9 10-68 5-26-15Z" fill="url(#cab)" stroke="#4D7A7D" stroke-width="2"/>
<path d="m513 145 11 29m21-25 15 25" stroke="#D9ECE2" stroke-width="2.5"/>
<path d="M496 151q31-2 54 13" stroke="#D7EAE4" stroke-width="2.8" fill="none" opacity=".67"/>
<!-- upper cabin windows, lower passengers' windows -->
<g><rect x="201" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="240" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="279" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="318" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="357" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="396" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="435" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="474" y="170" width="24" height="18" rx="2" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="131" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="173" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="215" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="257" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="299" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="341" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="383" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="425" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="467" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/><rect x="509" y="202" width="26" height="19" rx="3" fill="url(#cab)" stroke="#A6C8C1" stroke-width="1.3"/></g>
<path d="M146 196h423m-409-31h397" stroke="#78928D" stroke-width="2.2" opacity=".65"/>
<g stroke="#708E85" stroke-width="2.1"><path d="M165 150v-9m34 0v10m36-9v10m34-10v10m35-10v10m35-10v10m36-10v10m36-10v10m36-10v10m34-10v10m35-10v10"/></g>
<!-- two real lifeboats suspended on davits -->
<g stroke="#476C6D" stroke-linecap="round" fill="none"><path d="M238 197v-22l16-14m41 36v-22l-15-14m87 36v-22l16-14m41 36v-22l-16-14" stroke-width="2.3"/></g>
<path d="M236 198h65q-6 20-34 21-26 0-31-21Z" fill="#D6A181" stroke="#9A765F" stroke-width="2"/>
<path d="M368 198h66q-8 21-33 21-25-1-33-21Z" fill="#D6A181" stroke="#9A765F" stroke-width="2"/>
<!-- bow flare and proper displacement hull -->
<path d="M92 251q210-7 401-5l125-5q23 1 34 14l-12 37q-10 29-35 47-17 12-53 14H183q-58-3-73-22L70 272q-12-18 22-21Z" fill="url(#sea)" stroke="#2E6268" stroke-width="3.1" stroke-linejoin="round"/>
<path d="M77 270q249 9 568-7l-7 16q-281 22-541 12Z" fill="url(#terra)"/>
<path d="M94 275q239 11 539-6" fill="none" stroke="#F8F3E8" stroke-width="3.3" opacity=".84"/>
<path d="M106 299q239 15 516-2" fill="none" stroke="#80B8BA" stroke-width="2.2" opacity=".63"/>
<!-- bow and stern details, draught marks -->
<path d="M604 328q22-14 32-36" stroke="#D2E2DB" stroke-width="3.4" fill="none"/>
<g stroke="#C5D8CE" stroke-width="2"><path d="M580 322h15m-13-6h10m-8-6h9"/></g>
<!-- wave surface subtle, not cartoony -->
<path d="M50 363q18-8 36 0t36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0 36 0" stroke="#74AAA8" stroke-width="2.2" fill="none" opacity=".55"/>

</svg>