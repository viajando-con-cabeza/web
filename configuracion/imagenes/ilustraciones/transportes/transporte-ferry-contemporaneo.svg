<rect x="120" y="184" width="30" height="24" rx="4"/><rect x="162" y="184" width="30" height="24" rx="4"/><rect x="204" y="184" width="30" height="24" rx="4"/><rect x="246" y="184" width="30" height="24" rx="4"/><rect x="288" y="184" width="30" height="24" rx="4"/><rect x="330" y="184" width="30" height="24" rx="4"/><rect x="372" y="184" width="30" height="24" rx="4"/><rect x="414" y="184" width="30" height="24" rx="4"/><rect x="456" y="184" width="30" height="24" rx="4"/>
</g>
