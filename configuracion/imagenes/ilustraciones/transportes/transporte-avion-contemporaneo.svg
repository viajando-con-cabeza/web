<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="40 62 639 310" role="img" aria-label="Avión de pasajeros">
<title>Avión de pasajeros · Ilustración editorial vectorial de Viajando con Cabeza</title>
<defs>
<linearGradient id="pearl" x1="0.05" y1="0" x2="0.28" y2="1"><stop stop-color="#FFFCF5"/><stop offset=".48" stop-color="#E7ECE7"/><stop offset=".83" stop-color="#C6D2CB"/><stop offset="1" stop-color="#A4B7B0"/></linearGradient>
<linearGradient id="ivory" x1="0" y1="0" x2=".15" y2="1"><stop stop-color="#FFFEF9"/><stop offset=".55" stop-color="#F2EFE5"/><stop offset="1" stop-color="#CDCFC5"/></linearGradient>
<linearGradient id="copper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#E3A98B"/><stop offset=".52" stop-color="#C87A5C"/><stop offset="1" stop-color="#9F5543"/></linearGradient>
<linearGradient id="darkcopper" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#C78063"/><stop offset="1" stop-color="#7E4B42"/></linearGradient>
<linearGradient id="forest" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#6F9A91"/><stop offset=".52" stop-color="#395F5A"/><stop offset="1" stop-color="#223F42"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#BFD9D6"/><stop offset=".27" stop-color="#7FA7AC"/><stop offset=".6" stop-color="#426B78"/><stop offset="1" stop-color="#273E4B"/></linearGradient>
<linearGradient id="glassdeep" x1=".1" y1="0" x2=".7" y2="1"><stop stop-color="#547D88"/><stop offset=".55" stop-color="#294956"/><stop offset="1" stop-color="#1D333F"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#84B9B7"/><stop offset=".55" stop-color="#48858B"/><stop offset="1" stop-color="#356A76"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#DFE7DE"/><stop offset=".46" stop-color="#9CB3B1"/><stop offset=".62" stop-color="#F6F6EC"/><stop offset="1" stop-color="#A1A9A1"/></linearGradient>
<radialGradient id="ground"><stop stop-color="#304747" stop-opacity=".24"/><stop offset="1" stop-color="#304747" stop-opacity="0"/></radialGradient>
<radialGradient id="flare"><stop stop-color="#E8D2AD" stop-opacity=".34"/><stop offset="1" stop-color="#E8D2AD" stop-opacity="0"/></radialGradient>
<filter id="cast" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>

<radialGradient id="vccAmbient"><stop stop-color="#D2E3D7" stop-opacity=".48"/><stop offset=".58" stop-color="#E7ECE0" stop-opacity=".16"/><stop offset="1" stop-color="#F8F6EE" stop-opacity="0"/></radialGradient>
</defs>
<circle cx="529" cy="172" r="163" fill="url(#vccAmbient)" />
<path d="M78 203q45-64 115-83" fill="none" stroke="#9EBBAE" stroke-width="2.1" stroke-linecap="round" opacity=".14"/>
<ellipse cx="356" cy="368" rx="282" ry="18" fill="url(#ground)"/>

<!-- high wing and vertical stabiliser -->
<path d="M124 233 110 93q-1-14 13-18l17-5 101 153-23 32Z" fill="url(#copper)" stroke="#5E5B56" stroke-width="3" stroke-linejoin="round"/>
<path d="M133 91 200 210l-24-5-53-116Z" fill="#F4D8BA" opacity=".85"/>
<path d="M116 102 133 227" stroke="#FFF4E6" stroke-width="3" opacity=".5"/>
<path d="m126 226-74 44 18 8 169-25-39-33Z" fill="url(#forest)" stroke="#476861" stroke-width="2.5"/>
<path d="m97 261 123-27" stroke="#D5E8DA" stroke-width="3" opacity=".65"/>
<!-- background swept wing -->
<path d="M344 216 313 93q-2-8 8-9l22 2 129 139-28 21Z" fill="url(#silver)" stroke="#668982" stroke-width="2.5"/>
<path d="m321 99 95 127" stroke="#FDFDF6" stroke-width="5" opacity=".8"/>
<!-- sculpted body -->
<path d="M68 231q29-23 94-27 122-8 277-2l113 9q57 5 97 27 26 15 5 29-27 20-84 23-126 9-343 0Q112 285 73 263q-26-16-5-32Z" fill="url(#pearl)" stroke="#4A6767" stroke-width="3.1" stroke-linejoin="round"/>
<path d="M78 236q146-20 354-13 98 1 162 12" stroke="#FFFDF8" stroke-width="6" opacity=".87" stroke-linecap="round"/>
<path d="M68 257q102 24 265 29l225 2q56-2 86-24" fill="none" stroke="#709790" stroke-width="3.2" opacity=".85"/>
<!-- tapered heritage stripe -->
<path d="M79 258q107 18 269 19l207 2q53 0 93-17-29 19-90 24l-221 1q-171-5-258-29Z" fill="#B86C53" opacity=".96"/>
<path d="M170 254q124 9 229 7" stroke="#E4AE8D" stroke-width="2" opacity=".7"/>
<!-- aft service door -->
<path d="M165 216q-4 26-1 57" fill="none" stroke="#92AAA3" stroke-width="2"/>
<path d="M172 219v49m-7-38h6" stroke="#EFF7EE" stroke-width="1.5"/>
<!-- cabin glazing, tiny reflective upper rims -->
<g fill="url(#glassdeep)" stroke="#E0EEE8" stroke-width="1.6">
<rect x="206" y="225" width="17" height="11" rx="5"/><rect x="231" y="225" width="17" height="11" rx="5"/>
<rect x="256" y="225" width="17" height="11" rx="5"/><rect x="281" y="225" width="17" height="11" rx="5"/>
<rect x="306" y="225" width="17" height="11" rx="5"/><rect x="331" y="225" width="17" height="11" rx="5"/>
<rect x="356" y="225" width="17" height="11" rx="5"/><rect x="381" y="225" width="17" height="11" rx="5"/>
<rect x="406" y="225" width="17" height="11" rx="5"/><rect x="431" y="225" width="17" height="11" rx="5"/>
<rect x="456" y="226" width="17" height="11" rx="5"/><rect x="481" y="227" width="17" height="11" rx="5"/>
<rect x="506" y="228" width="17" height="11" rx="5"/>
</g>
<g fill="#D0E5DA" opacity=".6"><path d="m208 229 6-3h5l-7 5Zm101 0 7-3h4l-7 5Zm101 0 6-2h5l-7 4Zm100 3 6-2h4l-6 4Z"/></g>
<!-- cockpit windscreens -->
<path d="M572 221q24 3 47 14l-5 9-36-6q-8-3-6-17Z" fill="url(#glassdeep)" stroke="#567F7F" stroke-width="2.7"/>
<path d="m589 225-5 15m26-7-6 9" stroke="#D0E8DC" stroke-width="2" opacity=".8"/>
<path d="m629 246 16 5" stroke="#FFFFFF" stroke-width="2.4"/>
<!-- main starboard wing, elegant swept geometry -->
<path d="M309 267 443 269 558 347q12 9-7 12l-57 5-189-73Z" fill="url(#silver)" stroke="#4D7472" stroke-width="2.8" stroke-linejoin="round"/>
<path d="M344 281q83 18 175 70" fill="none" stroke="#FFFFFF" stroke-width="5.2" opacity=".85"/>
<path d="M402 272 491 359" stroke="#6E9E96" stroke-width="2" opacity=".8"/>
<path d="m525 339 20 13-42 2" fill="#C17C65" opacity=".75"/>
<!-- turbine below wing -->
<path d="M398 285q-16 12-14 29 3 19 24 24l41-1q22-3 24-23l-11-27Z" fill="url(#silver)" stroke="#426765" stroke-width="3"/>
<ellipse cx="408" cy="315" rx="18" ry="22" fill="#385958" stroke="#E1E9DC" stroke-width="3"/>
<ellipse cx="407" cy="315" rx="9" ry="13" fill="#93AAA3"/>
<path d="m409 303-2 10m-10 4 8-3m9 7-6-5" stroke="#365452" stroke-width="2" stroke-linecap="round"/>
<path d="M441 298q13 10 13 24" fill="none" stroke="#FFF9EA" stroke-width="3" opacity=".75"/>
<!-- fine tail and route flourishes -->
<path d="m550 280 14-2" stroke="#EFD6C5" stroke-width="2"/>
<g stroke="#739F99" stroke-width="2" stroke-linecap="round" opacity=".45"><path d="M54 310h52m-28 11h30m486-122h54m-28-11h28"/></g>


<!-- VCC: acabados editoriales originales -->
<path d="M97 161q44-24 90-29" stroke="#A0BBB2" stroke-width="2.2" stroke-dasharray="3 9" stroke-linecap="round" fill="none" opacity=".28"/>
<path d="m574 304 34 3" stroke="#D5C8B5" stroke-width="2" stroke-linecap="round" opacity=".6"/>
</svg>