<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="Tren de alta velocidad">
<title>Tren de alta velocidad · Ilustración editorial vectorial de Viajando con Cabeza</title>
<defs>
