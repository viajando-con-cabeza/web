<linearGradient id="glass" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#BFD9D6"/><stop offset=".27" stop-color="#7FA7AC"/><stop offset=".6" stop-color="#426B78"/><stop offset="1" stop-color="#273E4B"/></linearGradient>
