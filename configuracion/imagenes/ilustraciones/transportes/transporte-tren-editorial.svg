<radialGradient id="flare"><stop stop-color="#E8D2AD" stop-opacity=".34"/><stop offset="1" stop-color="#E8D2AD" stop-opacity="0"/></radialGradient>
<filter id="cast" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
