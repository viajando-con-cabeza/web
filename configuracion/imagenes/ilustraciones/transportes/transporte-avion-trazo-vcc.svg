<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="45 65 635 290" role="img" aria-label="Avión de pasajeros de perfil, ilustración editorial minimalista">
<title>Avión VCC · trazo editorial</title>
<!-- Dibujo propio: una silueta, dos colores y trazo expresivo. Sin imágenes raster. -->
<g stroke="#314C48" stroke-linecap="round" stroke-linejoin="round">
 <path d="M122 226 103 112q-2-13 12-17l16-3q9-1 15 10l85 121Z" fill="#C87A5D" stroke-width="4.4"/>
 <path d="m114 113 20-5 69 106" fill="none" stroke="#E8B18F" stroke-width="5" opacity=".8"/>
 <path d="M147 230 65 257l-11 11 138-10" fill="#9EBBB0" stroke-width="4"/>
 <!-- body and tapered nose -->
 <path d="M66 246q46-29 132-32h300q93 0 145 21 38 15 16 31-23 18-82 21H181q-77-3-109-24-17-10-6-17Z" fill="#F8F5EC" stroke-width="4.8"/>
 <path d="M70 263q144 29 358 28 152 0 223-25" fill="none" stroke="#C87A5D" stroke-width="7"/>
 <!-- main wing, swept and organic -->
 <path d="m299 271-113 67q-12 8 7 10l44-2 212-69Z" fill="#91B3A7" stroke-width="4.3"/>
 <path d="m212 337 191-56" fill="none" stroke="#DBE9DC" stroke-width="5"/>
 <!-- modest engine with one dark turbine -->
 <path d="m364 285-4 25 62 2-5-25" fill="#6B8E89" stroke-width="3.3"/>
 <path d="M358 310q8-10 37-10 27 0 30 15l-1 29q-4 14-22 15l-34-2q-17-6-17-22Z" fill="#E8EDE4" stroke-width="4"/>
 <ellipse cx="367" cy="332" rx="15" ry="22" fill="#416765" stroke-width="3"/>
 <!-- coherent cockpit -->
 <path d="M599 225q30 5 43 17l-6 13-44-7q-4-9 7-23Z" fill="#496F73" stroke-width="3.3"/>
 <path d="m618 232-8 16" fill="none" stroke="#B7D5CE" stroke-width="3"/>
</g>
<!-- rhythmic simple windows: visual, not technical -->
<path d="M194 238h345" fill="none" stroke="#496E71" stroke-width="9" stroke-linecap="round" stroke-dasharray="12 17"/>
<path d="M192 228h352" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".8" stroke-linecap="round"/>
<path d="m555 280 22 0" stroke="#F7E8D7" stroke-width="3" stroke-linecap="round"/>
<!-- hand-drawn movement strokes -->
<g fill="none" stroke="#A4BDB3" stroke-width="3.8" stroke-linecap="round" opacity=".65">
 <path d="M51 307h78"/><path d="M71 319h37"/><path d="M567 197h49"/>
</g>
</svg>