<!-- steel tracks and bogie geometry -->
<ellipse cx="352" cy="354" rx="292" ry="14" fill="url(#shade)"/>
<path d="M57 363h605M86 375h542" stroke="#7A9792" stroke-width="4" stroke-linecap="round"/>
<g stroke="#8EA8A1" stroke-width="2.3"><path d="m109 362-10 12m99-12-7 12m102-12-5 12m104-12 5 12m102-12 11 12m93-12 12 12"/></g>
<!-- pantograph near the rear, consistent electric rolling stock -->
<g stroke="#5F7773" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
 <path d="M300 139V116l29-29 31 29 25-28v26"/><path d="m310 119 47-33m-22 0 48 30"/><path d="M315 84h65"/>
</g>
<path d="M296 136h94" stroke="#617E79" stroke-width="5"/>
