<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Próximamente | Viajando con Cabeza</title>
<meta name="description" content="Estamos preparando nuevas guías, itinerarios y herramientas para viajar mejor. Muy pronto en Viajando con Cabeza.">
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
<style>
:root{--ink:#25211e;--cream:#f6f0e9;--paper:#fffdf9;--coral:#d87963;--brown:#8b6f5d;--line:#ded3c9}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}
.soon{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:48px 22px;overflow:hidden;position:relative}
.soon:before,.soon:after{content:"";position:absolute;border:1px dashed #bba99c;border-radius:50%;opacity:.55}
.soon:before{width:420px;height:420px;left:-220px;top:8%}.soon:after{width:520px;height:520px;right:-300px;bottom:-180px}
.card{width:min(900px,100%);background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:72px 70px;text-align:center;position:relative;z-index:1;box-shadow:0 18px 60px rgba(69,51,39,.06)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--brown)}
.icon{width:92px;height:92px;margin:22px auto 26px;border:1px dashed var(--brown);border-radius:50%;display:grid;place-items:center;font-size:38px;transform:rotate(-5deg)}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(58px,9vw,104px);line-height:.82;margin:0;letter-spacing:-.045em}
.script{font-family:"Nothing You Could Do",cursive;color:var(--coral);font-size:clamp(19px,3vw,28px);margin:22px 0}
p.copy{max-width:560px;margin:0 auto;color:#6f655f;font-size:14px;line-height:1.8}
.dots{display:flex;justify-content:center;align-items:center;gap:12px;margin:32px 0}.dots i{width:34px;border-top:1px dashed #a99180}.dots b{font-size:20px;color:var(--coral)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions a{text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.1em;border-radius:999px;padding:13px 20px}
.primary{background:var(--coral);color:white}.secondary{border:1px solid var(--brown);color:var(--brown);background:white}
@media(max-width:650px){.soon{padding:28px 14px}.card{padding:50px 22px;border-radius:20px}.icon{width:78px;height:78px}p.copy{font-size:13px}}
</style>
</head>
<body>
<main class="soon">
<section class="card">
<span class="eyebrow">VIAJANDO CON CABEZA · EN CONSTRUCCIÓN</span>
<div class="icon" aria-hidden="true">🔧</div>
<h1>PRÓXIMAMENTE</h1>
<p class="script">Estamos preparando algo bonito ♡</p>
<p class="copy">Esta parte del viaje todavía está en obras. Estamos trabajando en nuevas guías, itinerarios y herramientas para que puedas organizar tu próxima aventura con cabeza.</p>
<div class="dots"><i></i><b>✈</b><i></i></div>
<div class="actions"><a class="primary" href="../index.html">VOLVER AL INICIO →</a><a class="secondary" href="../destinos/index.html">EXPLORAR DESTINOS</a></div>
</section>
</main>
<script src="../js/site-header.js"></script>
</body>
</html>
